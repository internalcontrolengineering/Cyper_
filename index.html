  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;

  --ease: cubic-bezier(.22, 1, .36, 1);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --nav-h: 56px;
}

[data-theme="dark"] {
  --bg: #000000;
  --bg-elev: #1c1c1e;
  --bg-sunk: #2c2c2e;
  --glass: rgba(22, 22, 23, 0.72);
  --text: #f5f5f7;
  --text-2: #a1a1a6;
  --text-3: #86868b;
  --line: rgba(255, 255, 255, 0.09);
  --line-2: rgba(255, 255, 255, 0.16);
  --accent: #2997ff;
  --accent-hover: #47a6ff;
  --accent-soft: rgba(41, 151, 255, 0.16);
  --ok: #30d158;
  --ok-soft: rgba(48, 209, 88, 0.14);
  --warn: #ff9f0a;
  --danger: #ff453a;
  --danger-soft: rgba(255, 69, 58, 0.14);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 8px 30px rgba(0,0,0,.5);
  --shadow-lg: 0 30px 90px rgba(0,0,0,.7);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.47;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  transition: background .4s var(--ease), color .4s var(--ease);
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; }
a { color: var(--accent); text-decoration: none; }
svg.lucide { width: 18px; height: 18px; stroke-width: 1.8; flex-shrink: 0; }
:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; border-radius: 8px; }
.hidden { display: none !important; }
.muted { color: var(--text-2); }
.tiny { font-size: 12px; color: var(--text-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px; padding: 0 18px; border-radius: 980px;
  font-size: 14px; font-weight: 500; white-space: nowrap;
  transition: transform .2s var(--ease), background .2s, box-shadow .2s, opacity .2s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-sunk); color: var(--text); }
.btn-secondary:hover { background: var(--line-2); }
.btn-ghost { color: var(--accent); padding: 0 12px; }
.btn-ghost:hover { background: var(--accent-soft); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-lg { height: 48px; padding: 0 26px; font-size: 16px; }
.btn-sm { height: 30px; padding: 0 12px; font-size: 13px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: inline-grid; place-items: center; color: var(--text-2);
  transition: background .2s, color .2s, transform .2s var(--ease);
}
.icon-btn:hover { background: var(--bg-sunk); color: var(--text); }
.icon-btn:active { transform: scale(.92); }

/* ---------- Navbar ---------- */
.nav {
  position: sticky; top: 0; z-index: 50; height: var(--nav-h);
  background: var(--glass);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: 1240px; margin: 0 auto; height: 100%;
  display: flex; align-items: center; gap: 16px; padding: 0 24px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; color: var(--text); }
.brand svg, .brand .logo-img { width: 28px; height: 28px; object-fit: contain; }
.brand small { font-weight: 400; color: var(--text-3); font-size: 13px; }
.nav-links { display: flex; gap: 4px; margin-left: 12px; }
.nav-link {
  padding: 6px 14px; border-radius: 980px; font-size: 13px; color: var(--text-2);
  transition: color .2s, background .2s;
}
.nav-link:hover { color: var(--text); }
.nav-link.active { color: var(--text); background: var(--bg-sunk); }
.nav-spacer { flex: 1; }
.search {
  display: flex; align-items: center; gap: 8px; height: 34px; width: 260px;
  padding: 0 12px; border-radius: 980px; background: var(--bg-sunk);
  color: var(--text-3); transition: width .4s var(--ease), box-shadow .2s;
}
.search:focus-within { width: 340px; box-shadow: 0 0 0 4px var(--accent-soft); }
.search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 13px; color: var(--text); min-width: 0; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; font-size: 13px; font-weight: 600; color: #fff;
  background: linear-gradient(135deg, #5e5ce6, #bf5af2);
}
.user-menu { position: relative; }
.dropdown {
  position: absolute; right: 0; top: calc(100% + 10px); min-width: 240px;
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--r-md);
  box-shadow: var(--shadow-md); padding: 6px; z-index: 60;
  transform-origin: top right; animation: pop .25s var(--spring);
}
.dropdown-head { padding: 10px 12px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.dropdown-head strong { display: block; font-size: 14px; }
.dropdown-item {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 9px 12px; border-radius: 10px; font-size: 14px;
}
.dropdown-item:hover { background: var(--bg-sunk); }
.dropdown-item.danger { color: var(--danger); }

/* ---------- Layout ---------- */
.main { max-width: 1240px; margin: 0 auto; padding: 0 24px 120px; }
.view { animation: viewIn .6s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.98); } to { opacity: 1; transform: none; } }

.hero { padding: 72px 0 40px; text-align: center; }
.eyebrow { font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: 0; margin-bottom: 10px; }
.hero h1 {
  font-size: clamp(40px, 6vw, 72px); line-height: 1.04; letter-spacing: -0.035em; font-weight: 700;
  background: linear-gradient(180deg, var(--text) 30%, var(--text-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p { font-size: clamp(17px, 2vw, 21px); color: var(--text-2); max-width: 620px; margin: 16px auto 0; }
.hero-stats { display: flex; justify-content: center; gap: 48px; margin-top: 40px; flex-wrap: wrap; }
.stat strong { display: block; font-size: 32px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--text-3); }

.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 32px 0 20px; flex-wrap: wrap; }
.section-head h2 { font-size: 28px; font-weight: 600; letter-spacing: -0.025em; }
.section-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }

.crumbs { display: flex; align-items: center; gap: 6px; padding: 28px 0 0; font-size: 13px; color: var(--text-3); flex-wrap: wrap; }
.crumbs button { color: var(--accent); font-size: 13px; }
.crumbs button:hover { text-decoration: underline; }
.crumbs svg.lucide { width: 14px; height: 14px; }

.page-title { display: flex; align-items: center; gap: 18px; margin: 18px 0 8px; flex-wrap: wrap; }
.page-title h1 { font-size: clamp(32px, 4.4vw, 48px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; }
.page-title .glyph { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; color: #fff; box-shadow: var(--shadow-md); }
.page-title .glyph svg.lucide { width: 30px; height: 30px; }
.page-sub { color: var(--text-2); font-size: 17px; max-width: 720px; }

/* ---------- Area cards ---------- */
.grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.area-card {
  position: relative; border-radius: var(--r-xl); padding: 26px; min-height: 240px;
  background: var(--bg-elev); box-shadow: var(--shadow-sm); overflow: hidden;
  display: flex; flex-direction: column; text-align: left; cursor: pointer;
  transition: transform .5s var(--ease), box-shadow .5s var(--ease);
  animation: rise .7s var(--ease) both;
  isolation: isolate;
}
.area-card::before {
  content: ""; position: absolute; inset: auto -30% -60% auto; width: 260px; height: 260px; border-radius: 50%;
  background: var(--c1); opacity: .18; filter: blur(50px); z-index: -1;
  transition: transform .8s var(--ease), opacity .5s;
}
.area-card:hover { transform: translateY(-6px) scale(1.01); box-shadow: var(--shadow-md); }
.area-card:hover::before { transform: scale(1.4) translate(-20px, -30px); opacity: .32; }
.area-card .glyph {
  width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 8px 20px -6px var(--c1);
}
.area-card .glyph svg.lucide { width: 24px; height: 24px; }
.area-card h3 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-top: 22px; }
.area-card .code { font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: .06em; margin-top: 2px; }
.area-card p { font-size: 14px; color: var(--text-2); margin-top: 8px; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.area-card .meta { display: flex; gap: 14px; font-size: 13px; color: var(--text-3); margin-top: 18px; align-items: center; flex-wrap: wrap; }
.area-card .meta span { display: inline-flex; gap: 5px; align-items: center; }
.area-card .meta svg.lucide { width: 14px; height: 14px; }
.area-card .more { position: absolute; top: 18px; right: 18px; }
.area-card.locked { cursor: not-allowed; }
.area-card.locked > *:not(.lock-veil) { filter: grayscale(1); opacity: .55; }
.lock-veil {
  position: absolute; top: 22px; right: 22px; display: inline-flex; gap: 6px; align-items: center;
  font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 980px;
  background: var(--danger-soft); color: var(--danger);
}
.lock-veil svg.lucide { width: 13px; height: 13px; }

.add-card {
  border-radius: var(--r-xl); min-height: 240px; border: 2px dashed var(--line-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  color: var(--text-2); font-weight: 500; transition: all .4s var(--ease);
  animation: rise .7s var(--ease) both;
}
.add-card:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); transform: translateY(-4px); }
.add-card .plus { width: 52px; height: 52px; border-radius: 50%; background: var(--bg-sunk); display: grid; place-items: center; transition: transform .5s var(--spring); }
.add-card:hover .plus { transform: rotate(90deg) scale(1.08); background: var(--accent); color: #fff; }

/* ---------- Folder cards ---------- */
.folders { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.folder {
  position: relative; text-align: left; padding: 20px; border-radius: var(--r-lg);
  background: var(--bg-elev); box-shadow: var(--shadow-sm); cursor: pointer;
  transition: transform .4s var(--ease), box-shadow .4s var(--ease);
  animation: rise .6s var(--ease) both;
}
.folder:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.folder-icon { width: 54px; height: 44px; position: relative; margin-bottom: 18px; }
.folder-icon .back { position: absolute; inset: 0; border-radius: 6px 10px 10px 10px; background: var(--c2); }
.folder-icon .back::before { content: ""; position: absolute; top: -6px; left: 0; width: 22px; height: 10px; border-radius: 5px 5px 0 0; background: var(--c2); }
.folder-icon .front { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; border-radius: 8px; background: linear-gradient(160deg, var(--c1), var(--c2)); transform-origin: bottom; transition: transform .5s var(--spring); }
.folder:hover .folder-icon .front { transform: perspective(200px) rotateX(-22deg); }
.folder h4 { font-size: 16px; font-weight: 600; letter-spacing: -0.015em; }
.folder .tiny { margin-top: 4px; display: block; }
.folder .more { position: absolute; top: 12px; right: 12px; }
.add-folder { min-height: 150px; }

/* ---------- Docs ---------- */
.toolbar-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin: 26px 0 16px; }
.seg { display: inline-flex; padding: 3px; border-radius: 980px; background: var(--bg-sunk); gap: 2px; }
.seg button { height: 30px; padding: 0 14px; border-radius: 980px; font-size: 13px; color: var(--text-2); display: inline-flex; gap: 6px; align-items: center; transition: all .25s var(--ease); }
.seg button.on { background: var(--bg-elev); color: var(--text); box-shadow: var(--shadow-sm); font-weight: 500; }
.seg svg.lucide { width: 15px; height: 15px; }

.dropzone {
  border: 2px dashed var(--line-2); border-radius: var(--r-lg); padding: 36px 20px; text-align: center;
  color: var(--text-2); transition: all .35s var(--ease); background: var(--bg-elev); margin-bottom: 20px;
}
.dropzone .dz-icon { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 12px; background: var(--accent-soft); color: var(--accent); transition: transform .5s var(--spring); }
.dropzone .dz-icon svg.lucide { width: 26px; height: 26px; }
.dropzone strong { color: var(--text); font-weight: 600; display: block; font-size: 17px; }
.dropzone.drag { border-color: var(--accent); background: var(--accent-soft); transform: scale(1.01); }
.dropzone.drag .dz-icon { transform: translateY(-6px) scale(1.1); }

.doc-list { background: var(--bg-elev); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
.doc-scroll { overflow-x: auto; }
.doc-row {
  display: grid; grid-template-columns: 40px minmax(180px, 2.1fr) 104px minmax(110px, 1.1fr) 120px 96px 100px 52px 100px minmax(96px, .9fr) 32px; gap: 10px; align-items: center; min-width: 1130px;
  padding: 14px 18px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .2s;
  animation: viewIn .5s var(--ease) both;
}
.doc-row:last-child { border-bottom: 0; }
.doc-row:hover { background: var(--bg); }
.doc-row.head { cursor: default; font-size: 12px; color: var(--text-3); font-weight: 500; padding: 10px 18px; animation: none; background: transparent !important; }
.file-badge { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; letter-spacing: .02em; }
.doc-name strong { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-name span { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; letter-spacing: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 980px;
  font-size: 12px; font-weight: 500; background: var(--bg-sunk); color: var(--text-2); white-space: nowrap;
}
.chip svg.lucide { width: 12px; height: 12px; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.doc-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.doc-tile { background: var(--bg-elev); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow-sm); cursor: pointer; transition: transform .4s var(--ease), box-shadow .4s; text-align: left; animation: rise .5s var(--ease) both; }
.doc-tile:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.doc-tile .file-badge { width: 48px; height: 56px; border-radius: 8px 14px 8px 8px; margin-bottom: 14px; }
.doc-tile strong { display: block; font-weight: 500; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.doc-tile .tiny { margin-top: 6px; display: block; }

.empty { text-align: center; padding: 64px 20px; color: var(--text-2); }
.empty .e-icon { width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 16px; display: grid; place-items: center; background: var(--bg-sunk); color: var(--text-3); }
.empty .e-icon svg.lucide { width: 32px; height: 32px; }
.empty h3 { color: var(--text); font-size: 20px; font-weight: 600; margin-bottom: 6px; }

/* ---------- Modals ---------- */
.modal-root { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.32); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); animation: fade .3s var(--ease); }
@keyframes fade { from { opacity: 0; } }
.modal {
  position: relative; width: 100%; max-width: 560px; max-height: calc(100dvh - 40px);
  background: var(--bg-elev); border-radius: var(--r-xl); box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; overflow: hidden; animation: modalIn .5s var(--spring);
}
.modal.wide { max-width: 760px; }
.modal.full { max-width: 1180px; height: calc(100dvh - 40px); }
.modal.closing { animation: modalOut .25s var(--ease) forwards; }
.modal-root.closing .modal-backdrop { animation: fade .25s var(--ease) reverse forwards; }
@keyframes modalIn { from { opacity: 0; transform: translateY(30px) scale(.96); } }
@keyframes modalOut { to { opacity: 0; transform: translateY(16px) scale(.97); } }
.modal-head { display: flex; align-items: flex-start; gap: 14px; padding: 24px 26px 8px; }
.modal-head h3 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.modal-head p { font-size: 14px; color: var(--text-2); margin-top: 3px; }
.modal-head .icon-btn { margin-left: auto; margin-top: -4px; margin-right: -8px; }
.modal-body { padding: 16px 26px 8px; overflow-y: auto; flex: 1; }
.modal-foot { padding: 16px 26px 22px; display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; border-top: 1px solid transparent; }
.modal-foot .left { margin-right: auto; }

/* ---------- Forms ---------- */
.field { margin-bottom: 16px; }
.field label, .label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
.field .hint { font-size: 12px; color: var(--text-3); margin-top: 5px; }
.field .err { font-size: 12px; color: var(--danger); margin-top: 5px; }
.input, .select, .textarea {
  width: 100%; height: 44px; padding: 0 14px; border-radius: 12px;
  border: 1px solid var(--line-2); background: var(--bg-elev); outline: 0;
  transition: border-color .2s, box-shadow .2s; font-size: 15px;
}
.textarea { height: auto; min-height: 84px; padding: 12px 14px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.input.invalid { border-color: var(--danger); box-shadow: 0 0 0 4px var(--danger-soft); }
.input[readonly] { background: var(--bg-sunk); color: var(--text-2); }
.row { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
.row-3 { display: grid; gap: 14px; grid-template-columns: 1fr 1fr 1fr; }
.input-affix { position: relative; }
.input-affix .input { padding-right: 130px; }
.input-affix .affix { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 14px; pointer-events: none; }
.input-icon { position: relative; }
.input-icon .input { padding-right: 44px; }
.input-icon button { position: absolute; right: 4px; top: 4px; }

.switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; border-radius: 980px; background: var(--line-2); transition: background .3s var(--ease); cursor: pointer; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .35s var(--spring); }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { box-shadow: 0 0 0 4px var(--accent-soft); }

.option-cards { display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); }
.option-cards.two { grid-template-columns: 1fr 1fr; }
.opt {
  position: relative; border: 1.5px solid var(--line-2); border-radius: 14px; padding: 14px; cursor: pointer;
  transition: all .25s var(--ease); display: block;
}
.opt input { position: absolute; opacity: 0; }
.opt .t { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.opt .d { font-size: 12px; color: var(--text-3); margin-top: 4px; line-height: 1.35; }
.opt:hover { border-color: var(--text-3); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.opt:has(input:checked) .t { color: var(--accent); }

.area-picks { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.area-pick { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line-2); cursor: pointer; transition: all .2s var(--ease); font-size: 14px; font-weight: 500; }
.area-pick input { position: absolute; opacity: 0; }
.area-pick .dot { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--c1), var(--c2)); }
.area-pick .dot svg.lucide { width: 12px; height: 12px; }
.area-pick .chk { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; transition: all .2s; }
.area-pick .chk svg.lucide { width: 12px; height: 12px; opacity: 0; color: #fff; stroke-width: 3; }
.area-pick:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.area-pick:has(input:checked) .chk { background: var(--accent); border-color: var(--accent); }
.area-pick:has(input:checked) .chk svg.lucide { opacity: 1; }

.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; position: relative; transition: transform .25s var(--spring); }
.swatch input { position: absolute; opacity: 0; }
.swatch:hover { transform: scale(1.1); }
.swatch:has(input:checked) { box-shadow: 0 0 0 3px var(--bg-elev), 0 0 0 5px var(--text); }
.icon-picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; }
.icon-pick { height: 44px; border-radius: 12px; border: 1.5px solid var(--line-2); display: grid; place-items: center; cursor: pointer; color: var(--text-2); transition: all .2s; }
.icon-pick input { position: absolute; opacity: 0; }
.icon-pick:has(input:checked) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.chips-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chips-quick button { height: 28px; padding: 0 12px; border-radius: 980px; background: var(--bg-sunk); font-size: 12.5px; transition: all .2s; }
.chips-quick button:hover, .chips-quick button.on { background: var(--accent); color: #fff; }

.reveal { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease), opacity .3s; opacity: 0; }
.reveal > div { overflow: hidden; }
.reveal.open { grid-template-rows: 1fr; opacity: 1; }

.progress-steps { display: flex; gap: 6px; margin: 6px 0 4px; }
.progress-steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--bg-sunk); transition: background .4s; }
.progress-steps i.done { background: var(--ok); }
.progress-steps i.now { background: var(--accent); }
.file-preview-card { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 14px; background: var(--bg); margin-bottom: 18px; }
.file-preview-card .doc-name { min-width: 0; }

/* ---------- Viewer ---------- */
.viewer-head { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.viewer-head .doc-name { min-width: 0; flex: 1; }
.viewer-head .doc-name strong { font-size: 17px; font-weight: 600; }
.viewer-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.viewer-body { flex: 1; display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
.viewer-stage { overflow: auto; background: var(--bg-sunk); padding: 32px; position: relative; }
.viewer-side { border-left: 1px solid var(--line); overflow-y: auto; padding: 20px; }
.viewer-side h5 { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 10px; }
.viewer-side h5:first-child { margin-top: 0; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 10px; font-size: 13px; }
.kv dt { color: var(--text-3); }
.kv dd { word-break: break-word; }
.history { list-style: none; }
.history li { position: relative; padding: 0 0 14px 20px; font-size: 13px; }
.history li::before { content: ""; position: absolute; left: 4px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.history li::after { content: ""; position: absolute; left: 7.5px; top: 18px; bottom: 0; width: 1px; background: var(--line-2); }
.history li:last-child::after { display: none; }
.history strong { font-weight: 600; }
.history button { color: var(--accent); font-size: 12px; }

.paper {
  max-width: 820px; margin: 0 auto; min-height: 100%; background: #fff; color: #1d1d1f;
  border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.08), 0 20px 50px rgba(0,0,0,.08);
  padding: 64px 72px; outline: 0; font-family: Georgia, "Times New Roman", serif; font-size: 15px; line-height: 1.65;
  position: relative;
}
.paper h1, .paper h2, .paper h3 { font-family: var(--font); letter-spacing: -0.02em; margin: 1em 0 .4em; line-height: 1.2; }
.paper h1 { font-size: 28px; } .paper h2 { font-size: 21px; } .paper h3 { font-size: 17px; }
.paper p { margin: 0 0 .8em; }
.paper ul, .paper ol { margin: 0 0 .8em 1.4em; }
.paper table { border-collapse: collapse; width: 100%; margin: 1em 0; font-family: var(--font); font-size: 13px; }
.paper td, .paper th { border: 1px solid #d2d2d7; padding: 6px 8px; text-align: left; vertical-align: top; }
.paper th { background: #f5f5f7; }
.paper img { max-width: 100%; }
.paper[contenteditable="true"] { box-shadow: 0 0 0 3px var(--accent), 0 20px 50px rgba(0,0,0,.1); }
.paper.readonly, .viewer-stage.readonly { user-select: none; -webkit-user-select: none; }
.watermark {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2;
  background-image: var(--wm); background-repeat: repeat;
}
.edit-toolbar {
  position: sticky; top: -32px; z-index: 5; margin: -32px -32px 24px; padding: 10px 16px;
  display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line);
}
.edit-toolbar .icon-btn { width: 34px; height: 34px; border-radius: 9px; }
.edit-toolbar .icon-btn.on { background: var(--accent-soft); color: var(--accent); }
.edit-toolbar .sep { width: 1px; background: var(--line-2); margin: 6px 6px; }
.edit-toolbar select { height: 34px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--bg-elev); padding: 0 8px; font-size: 13px; }
.stage-frame { width: 100%; height: 100%; min-height: 70vh; border: 0; border-radius: 8px; background: #fff; }
.stage-img { display: block; max-width: 100%; margin: 0 auto; border-radius: 8px; box-shadow: var(--shadow-md); }
.locked-state { height: 100%; display: grid; place-items: center; text-align: center; }
.locked-state .e-icon { background: var(--danger-soft); color: var(--danger); }

/* ---------- Settings ---------- */
.settings { display: grid; grid-template-columns: 230px 1fr; gap: 32px; margin-top: 28px; align-items: start; }
.side-nav { position: sticky; top: calc(var(--nav-h) + 20px); display: flex; flex-direction: column; gap: 2px; }
.side-nav button { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; font-size: 14px; color: var(--text-2); text-align: left; transition: all .2s; }
.side-nav button:hover { background: var(--bg-sunk); color: var(--text); }
.side-nav button.on { background: var(--bg-elev); color: var(--text); font-weight: 500; box-shadow: var(--shadow-sm); }
.panel { background: var(--bg-elev); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: 26px; margin-bottom: 20px; animation: viewIn .5s var(--ease) both; }
.panel h3 { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
.panel > p.muted { font-size: 14px; margin-top: 4px; margin-bottom: 18px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 0; border-top: 1px solid var(--line); }
.set-row:first-of-type { border-top: 0; }
.set-row .txt strong { display: block; font-weight: 500; font-size: 14.5px; }
.set-row .txt span { font-size: 13px; color: var(--text-3); }
.set-row .ctl { flex-shrink: 0; width: 260px; display: flex; justify-content: flex-end; }
.set-row .ctl .input, .set-row .ctl .select { height: 38px; font-size: 14px; }

.table-wrap { overflow-x: auto; margin: 0 -26px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 860px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 500; color: var(--text-3); padding: 10px 14px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th:first-child, .tbl td:first-child { padding-left: 26px; }
.tbl th:last-child, .tbl td:last-child { padding-right: 26px; }
.tbl .u { display: flex; gap: 10px; align-items: center; }
.tbl .u .avatar { width: 34px; height: 34px; }
.tbl .u strong { display: block; font-weight: 500; }
.grants { display: flex; flex-direction: column; gap: 6px; }
.grant { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
.grant .name { font-weight: 500; min-width: 110px; }
.grant .x { color: var(--text-3); width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; }
.grant .x:hover { background: var(--danger-soft); color: var(--danger); }
.grant .x svg.lucide { width: 13px; height: 13px; }
.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.matrix .switch { display: inline-block; }
.audit-row { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 13.5px; align-items: flex-start; }
.audit-row:first-child { border-top: 0; }
.audit-row .ai { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-sunk); color: var(--text-2); flex-shrink: 0; }
.audit-row .ai svg.lucide { width: 14px; height: 14px; }

/* ---------- Tabla de documentos ---------- */
.cell-clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.doc-row.head span { line-height: 1.25; }
.doc-row.info { cursor: default; }
.doc-row.info:hover { background: transparent; }
.doc-row.info svg.lucide { width: 15px; height: 15px; color: var(--text-3); }
.cat-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cat-chips .chip { padding-right: 4px; }
.cat-chips .x { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--text-3); }
.cat-chips .x:hover { background: var(--danger-soft); color: var(--danger); }
.cat-chips .x svg.lucide { width: 12px; height: 12px; }

/* ---------- Dashboard ---------- */
.dash { margin-top: 56px; }
.dash-filters { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.dsel { display: flex; flex-direction: column; gap: 4px; }
.dsel span { font-size: 11.5px; font-weight: 500; color: var(--text-3); padding-left: 4px; }
.dsel .select { height: 36px; width: auto; min-width: 170px; border-radius: 980px; font-size: 13px; padding: 0 14px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
.kpi { background: var(--bg-elev); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: 20px 22px; display: flex; flex-direction: column; gap: 2px; animation: rise .6s var(--ease) both; }
.kpi svg.lucide { width: 20px; height: 20px; color: var(--accent); margin-bottom: 10px; }
.kpi strong { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13px; color: var(--text-2); }
.kpi em { font-style: normal; font-size: 12px; color: var(--text-3); }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.chart-card { background: var(--bg-elev); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: 20px 22px; animation: rise .7s var(--ease) both; min-width: 0; }
.chart-card.span2 { grid-column: span 2; }
.ch-head h4 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 12px; }
.ch-box { position: relative; height: 240px; }
.span2 .ch-box { height: 260px; }
.ch-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-3); font-size: 13px; background: var(--bg-elev); }
@media (max-width: 900px) { .kpis { grid-template-columns: 1fr 1fr; } .charts { grid-template-columns: 1fr; } .chart-card.span2 { grid-column: auto; } }

/* ---------- Selección múltiple ---------- */
.ck { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; vertical-align: middle; }
.bulk-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; overflow: hidden;
  max-height: 0; opacity: 0; margin-top: 0; padding: 0 14px; border-radius: 14px; background: var(--accent-soft);
  font-size: 14px; font-weight: 500; color: var(--accent);
  transition: max-height .4s var(--ease), opacity .3s, margin .4s var(--ease), padding .4s var(--ease);
}
.bulk-bar.open { max-height: 120px; opacity: 1; margin-top: 16px; padding: 10px 14px; }

/* ---------- Login ---------- */
.login {
  min-height: 100dvh; display: grid; place-items: center; padding: 24px; position: relative; overflow: hidden;
}
.login .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .5; animation: float 18s ease-in-out infinite; }
.login .orb.a { width: 520px; height: 520px; background: #5e5ce6; top: -160px; left: -120px; }
.login .orb.b { width: 460px; height: 460px; background: #ff375f; bottom: -180px; right: -100px; animation-delay: -6s; }
.login .orb.c { width: 380px; height: 380px; background: #64d2ff; top: 40%; left: 55%; animation-delay: -12s; opacity: .35; }
@keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(60px,40px) scale(1.1); } 66% { transform: translate(-40px,60px) scale(.95); } }
.login-card {
  position: relative; width: 100%; max-width: 420px; padding: 44px 38px 34px; border-radius: 32px;
  background: var(--glass); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid var(--line); box-shadow: var(--shadow-lg); text-align: center; animation: modalIn .8s var(--spring);
}
.login-card .logo { width: 72px; height: 72px; margin: 0 auto 18px; color: var(--text); }
.login-card .logo .logo-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 18px rgba(0,0,0,.18)); }
.login-card h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; }
.login-card > p { color: var(--text-2); margin: 6px 0 26px; }
.login-card .field { text-align: left; }
.login-card .btn { width: 100%; margin-top: 6px; }
.demo-users { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--text-3); text-align: left; }
.demo-users button { display: flex; justify-content: space-between; width: 100%; padding: 6px 8px; border-radius: 8px; font-size: 12.5px; color: var(--text-2); }
.demo-users button:hover { background: var(--bg-sunk); }
.shake { animation: shake .45s var(--ease); }
@keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }

/* ---------- Toast ---------- */
.toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 980px; font-size: 14px; font-weight: 500;
  background: rgba(29,29,31,.92); color: #f5f5f7; box-shadow: var(--shadow-lg); backdrop-filter: blur(20px);
  animation: toastIn .5s var(--spring);
}
[data-theme="dark"] .toast { background: rgba(245,245,247,.95); color: #1d1d1f; }
.toast.out { animation: toastOut .3s var(--ease) forwards; }
.toast svg.lucide { width: 16px; height: 16px; }
.toast.ok svg.lucide { color: #30d158; } .toast.err svg.lucide { color: #ff453a; }
@keyframes toastIn { from { opacity: 0; transform: translateY(20px) scale(.9); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(10px) scale(.95); } }

.ctx { position: fixed; z-index: 150; }

/* ---------- Print: bloquea impresión para "solo ver" ---------- */
@media print { body.no-print * { display: none !important; } body.no-print::after { content: "Impresión no permitida para este documento."; display: block; padding: 40px; font: 16px sans-serif; } }

/* ---------- Barra de pestañas móvil ---------- */
.tabbar { display: none; position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 60; gap: 4px; padding: 5px; border-radius: 980px;
  background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); box-shadow: var(--shadow-md); border: 1px solid var(--line); }
.tabbar .nav-link { white-space: nowrap; }

/* ---------- Responsive ---------- */
@media (max-width: 1000px) {
  .viewer-body { grid-template-columns: 1fr; }
  .viewer-side { border-left: 0; border-top: 1px solid var(--line); max-height: 260px; }
}
@media (max-width: 760px) {
  .nav-links { display: none; }
  .tabbar { display: flex; }
  .main { padding-bottom: 88px; }
  .search { width: 160px; } .search:focus-within { width: 200px; }
  .settings { grid-template-columns: 1fr; }
  .side-nav { position: static; flex-direction: row; overflow-x: auto; }
  .side-nav button { white-space: nowrap; }
  .row, .row-3 { grid-template-columns: 1fr; }
  .option-cards { grid-template-columns: 1fr; }
  .set-row { flex-direction: column; align-items: stretch; }
  .set-row .ctl { width: 100%; justify-content: flex-start; }
  .paper { padding: 32px 24px; }
  .viewer-stage { padding: 16px; }
  .edit-toolbar { margin: -16px -16px 16px; top: -16px; }
  .hero { padding-top: 48px; }
  .hero-stats { gap: 28px; }
  .brand small { display: none; }
}
@media (max-width: 480px) { .search { display: none; } .main { padding: 0 16px 100px; } .nav-inner { padding: 0 16px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- Jerarquía documental (rector → asociados) ---------- */
.doc-row .doc-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.doc-row .doc-name > div { min-width: 0; display: flex; flex-direction: column; }
.doc-row .doc-name > div strong, .doc-row .doc-name > div span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-row.child { background: color-mix(in srgb, var(--bg-sunk) 45%, transparent); }
.doc-row.child > .file-badge { transform: scale(.86); margin-left: 18px; }
.doc-row.child .doc-name { padding-left: 16px; }
.tree-mark { display: inline-grid; place-items: center; color: var(--text-3); flex: none; }
.tree-mark svg.lucide { width: 15px; height: 15px; }
.doc-row.ref { opacity: .72; }
.doc-row.ref .doc-name strong { font-weight: 500; }
.doc-row.ref:hover { opacity: 1; }
.doc-row.hit { box-shadow: inset 3px 0 0 var(--accent); }
.chip.cat-est { background: rgba(191, 90, 242, .14); color: #a646d9; }
.chip.cat-ope { background: rgba(10, 132, 255, .13); color: #0a6fd8; }
.chip.cat-sop { background: rgba(48, 209, 88, .15); color: #1f9d45; }
[data-theme="dark"] .chip.cat-est { color: #d49bff; }
[data-theme="dark"] .chip.cat-ope { color: #64b5ff; }
[data-theme="dark"] .chip.cat-sop { color: #5fe08a; }
.input.cat-est { color: #a646d9; font-weight: 600; }
.input.cat-ope { color: #0a6fd8; font-weight: 600; }
.input.cat-sop { color: #1f9d45; font-weight: 600; }
.chip.ver { min-width: 28px; justify-content: center; font-variant-numeric: tabular-nums; }
.rector-field { padding: 14px 16px; border-radius: 14px; background: rgba(48, 209, 88, .08); border: 1px solid rgba(48, 209, 88, .25); animation: rise .35s var(--ease) both; }
.rector-field select.invalid { border-color: var(--danger); }
.doc-tile.child { border-left: 3px solid #30d158; }
.doc-tile.ref { opacity: .72; }
.tile-rel { display: inline-flex; align-items: center; gap: 4px; color: var(--text-3); }
.tile-rel svg.lucide { width: 12px; height: 12px; }
.rel-link { color: var(--accent); text-align: left; font: inherit; padding: 0; background: none; border: 0; cursor: pointer; }
.rel-link:hover { text-decoration: underline; }
.rel-list { list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.rel-list li { display: flex; flex-direction: column; gap: 1px; }
.tipo-group { margin-bottom: 14px; }
.tg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.hero.hero-sm { padding-top: 56px; padding-bottom: 8px; }
.hero.hero-sm h1 { font-size: clamp(36px, 5vw, 56px); }

/* ---------- Usuario + dominio configurado ---------- */
.email-split { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.email-split .select { width: auto; min-width: 150px; }

  <script>
/* =========================================================
   Capa de datos — FileHub
   ---------------------------------------------------------
   Toda la lectura/escritura pasa por `Repo` y `Files`.
   Hoy: metadatos en localStorage, binarios en IndexedDB
   (localStorage solo admite ~5 MB y no sirve para archivos).
   Mañana: reemplazar el cuerpo de estos métodos por llamadas a
   Supabase (tablas + Storage) sin tocar la interfaz (app.js).
   ========================================================= */
(function () {
  const KEY = 'acervo.db.v2';
  const LEGACY_KEYS = ['acervo.db.v1'];

  /* Almacenamiento seguro: usa localStorage / sessionStorage si el navegador
     los permite; si están bloqueados (iframes aislados, modo privado estricto)
     cae a memoria para que la app siga funcionando. */
  function safeStore(kind) {
    try {
      const st = window[kind];
      const t = '__acervo_test__'; st.setItem(t, '1'); st.removeItem(t);
      return { store: st, persistent: true };
    } catch (e) {
      const mem = new Map();
      return { persistent: false, store: {
        getItem: (k) => (mem.has(k) ? mem.get(k) : null),
        setItem: (k, v) => mem.set(k, String(v)),
        removeItem: (k) => mem.delete(k),
      } };
    }
  }
  const LS = safeStore('localStorage');
  const SS = safeStore('sessionStorage');
  window.LocalStore = LS.store;
  window.SessionStore = SS.store;
  window.STORAGE_PERSISTENT = LS.persistent;
  const uid = (p = '') => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

  /* Contraseñas: PBKDF2-SHA256 con sal aleatoria por usuario.
     Nunca se guarda ni se incluye en el código ninguna contraseña en claro. */
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0));
  const PBKDF2_ITER = 150000;
  async function hashPassword(pass, saltB64 = null) {
    const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: PBKDF2_ITER, hash: 'SHA-256' }, key, 256);
    return { alg: 'PBKDF2-SHA256', iter: PBKDF2_ITER, salt: b64(salt), hash: b64(bits) };
  }
  async function verifyPassword(pass, rec) {
    if (!rec || typeof rec !== 'object' || !rec.salt) return false;
    const h = await hashPassword(pass, rec.salt);
    // comparación de tiempo constante
    let diff = h.hash.length ^ rec.hash.length;
    for (let i = 0; i < Math.min(h.hash.length, rec.hash.length); i++) diff |= h.hash.charCodeAt(i) ^ rec.hash.charCodeAt(i);
    return diff === 0;
  }


  /* ---------- Perfiles por defecto (configurables) ---------- */
  const CAPS = [
    { key: 'createArea', label: 'Crear y editar áreas' },
    { key: 'createFolder', label: 'Crear y editar carpetas' },
    { key: 'upload', label: 'Subir documentos' },

    { key: 'managePerms', label: 'Asignar permisos' },

  const defaultRoles = () => ([

      caps: { createArea: true, createFolder: true, upload: true, deleteDocs: true, managePerms: true, settings: true, allAreas: true } },
    { id: 'gestor', name: 'Gestor de área', desc: 'Crea carpetas y sube documentos en sus áreas',

    { id: 'colaborador', name: 'Colaborador', desc: 'Sube documentos en las áreas asignadas',
      caps: { createArea: false, createFolder: false, upload: true, deleteDocs: false, managePerms: false, settings: false, allAreas: false } },

    ['Anexo', 'Soporte'], ['Ayuda Visual', 'Soporte'], ['Bitácora', 'Soporte'], ['Catálogo', 'Soporte'], ['Comunicado', 'Soporte'], ['Formato', 'Soporte'], ['Guía', 'Soporte'],
    ['Hoja de Verificación', 'Soporte'], ['Instrucción de Operación', 'Soporte'], ['Instructivo de Llenado', 'Soporte'], ['Listado', 'Soporte'], ['Registro', 'Soporte'],
  ].map(([name, cat]) => ({ name, cat }));

  const defaultSettings = () => ({
    orgName: '',
    appName: 'FileHub',
    domains: [],               // dominios de correo permitidos (Configuración → General)
    theme: 'auto',
    nomenRegex: '^([A-Z]{2,}[0-9]*(?:[-_.][A-Z0-9]+)+)(?=[\\s_-]|$)',
    versionInicial: '1',
    autoVersion: true,
    maxMB: 20,
    allowedExt: 'pdf,doc,docx,xls,xlsx,csv,txt,md,html,png,jpg,jpeg,webp,ppt,pptx',
    downloadFormat: 'pdf',      // pdf | original
    watermark: true,
    blockPrint: true,
    showLockedAreas: true,
    expiredBehavior: 'bloquear', // bloquear | ver
    defaultTempHours: 72,
    minPassword: 8,
  });

  /* ---------- IndexedDB para binarios ---------- */
  const memFiles = new Map();
  let idbOk = true;
  try { idbOk = !!window.indexedDB; } catch (e) { idbOk = false; }
  const Files = {
    _db: null,
    open() {
      if (!idbOk) return Promise.reject(new Error('IndexedDB no disponible'));
      if (this._db) return Promise.resolve(this._db);
      return new Promise((res, rej) => {
        const r = indexedDB.open('acervo.files', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('files');
        r.onsuccess = () => { this._db = r.result; res(this._db); };
        r.onerror = () => { idbOk = false; rej(r.error); };
      });
    },
    async put(key, value) {
      const db = await this.open().catch(() => null);
      if (!db) { memFiles.set(key, value); return true; }
      return new Promise((res, rej) => {
        const tx = db.transaction('files', 'readwrite');
        tx.objectStore('files').put(value, key);
        tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error);
      });
    },
    async get(key) {
      const db = await this.open().catch(() => null);
      if (!db) return memFiles.get(key);
      return new Promise((res, rej) => {
        const r = db.transaction('files').objectStore('files').get(key);
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    },
    async del(key) {
      const db = await this.open().catch(() => null);
      if (!db) { memFiles.delete(key); return true; }
      return new Promise((res) => {
        const tx = db.transaction('files', 'readwrite');
        tx.objectStore('files').delete(key);
        tx.oncomplete = () => res(true); tx.onerror = () => res(false);
      });
    },
    async clear() {
      const db = await this.open().catch(() => null);
      if (!db) { memFiles.clear(); return true; }
      return new Promise((res) => {
        const tx = db.transaction('files', 'readwrite');
        tx.objectStore('files').clear();
        tx.oncomplete = () => res(true);
      });
    },
  };

  /* ---------- Repositorio de metadatos ---------- */
  const Repo = {
    db: null,
    CAPS,
    uid,
    hashPassword,
    verifyPassword,
    load() {
      LEGACY_KEYS.forEach(k => { try { LS.store.removeItem(k); } catch (e) {} });
      try { this.db = JSON.parse(LS.store.getItem(KEY)); } catch { this.db = null; }
      return this.db;
    },
    save() {
      try { LS.store.setItem(KEY, JSON.stringify(this.db)); }
      catch (e) { console.error(e); window.toast && toast('No se pudo guardar: almacenamiento lleno', 'err'); }
    },
    /* Primera configuración: crea al administrador definido por el usuario.

    async init({ email, name, pass }, withSamples = true) {
      const now = Date.now();
      const adminId = uid('u_');
      const settings = defaultSettings();
      const users = [{ id: adminId, email, name, role: 'admin', pass: await hashPassword(pass), active: true, createdAt: now, createdBy: adminId }];
      const base = { version: 3, settings, roles: defaultRoles(), users, areas: [], folders: [], docs: [], grants: [], catalogs: { tipos: DEFAULT_TIPOS(), clasificaciones: [] },
        audit: [{ id: uid('l_'), at: now, by: adminId, action: 'sistema', text: `Repositorio inicializado por ${email}` }] };

      if (withSamples) await this._samples(adminId);
      this.save();
      return this.db;

    async _samples(ownerId) {
      const now = Date.now();
      const H = 3600e3, D = 24 * H;
      const areas = [
        { id: 'a_cal', name: 'Calidad', code: 'SGC', desc: 'Sistema de gestión de calidad, procedimientos, formatos y auditorías.', color: 'blue', icon: 'badge-check' },
        { id: 'a_rh', name: 'Recursos Humanos', code: 'RH', desc: 'Políticas de personal, reclutamiento, capacitación y nómina.', color: 'pink', icon: 'users' },
        { id: 'a_fin', name: 'Finanzas', code: 'FIN', desc: 'Contabilidad, tesorería, presupuestos y reportes financieros.', color: 'green', icon: 'landmark' },
        { id: 'a_ope', name: 'Operaciones', code: 'OPE', desc: 'Logística, producción, mantenimiento y seguridad industrial.', color: 'orange', icon: 'factory' },
        { id: 'a_ti', name: 'Tecnología', code: 'TI', desc: 'Infraestructura, desarrollo, seguridad de la información y soporte.', color: 'indigo', icon: 'cpu' },
        { id: 'a_jur', name: 'Jurídico', code: 'JUR', desc: 'Contratos, convenios, poderes y cumplimiento normativo.', color: 'graphite', icon: 'scale' },
      ].map((a, i) => ({ ...a, createdAt: now - (30 - i) * D, createdBy: ownerId, order: i }));

      const fd = (areaId, list) => list.map(([name, code], i) => ({ id: uid('f_'), areaId, name, code, createdAt: now - 20 * D, createdBy: ownerId, order: i }));
      const folders = [

      const prFolder = folders.find(f => f.areaId === 'a_cal' && f.code === 'PR');
      const foFolder = folders.find(f => f.areaId === 'a_cal' && f.code === 'FO');

      const sampleDocs = [
        { folder: prFolder, nomenclatura: 'SGC-PR-001', nombre: 'Control de documentos', version: '2', tipo: 'Procedimiento', clasificacion: 'Interno', age: 400, html: docTpl('SGC-PR-001', 'Control de documentos', [
            ['1. Objetivo', 'Establecer los lineamientos para la elaboración, revisión, aprobación, distribución y control de los documentos del Sistema de Gestión de Calidad de COMASW.'],
            ['2. Alcance', 'Aplica a todos los documentos internos y externos que forman parte del SGC en todas las áreas de la organización.'],
            ['3. Responsabilidades', '<ul><li><b>Coordinación de Calidad:</b> administra el repositorio y la lista maestra.</li><li><b>Dueños de proceso:</b> elaboran y actualizan sus documentos.</li><li><b>Dirección:</b> aprueba documentos de nivel estratégico.</li></ul>'],
            ['4. Desarrollo', '<table><tr><th>Paso</th><th>Actividad</th><th>Responsable</th></tr><tr><td>1</td><td>Elaborar borrador con la nomenclatura vigente</td><td>Dueño de proceso</td></tr><tr><td>2</td><td>Revisar contenido y formato</td><td>Calidad</td></tr><tr><td>3</td><td>Aprobar y publicar en Acervo</td><td>Dirección</td></tr></table>'],
          ]) },
        { folder: prFolder, nomenclatura: 'SGC-PR-002', nombre: 'Auditorías internas', version: '1', tipo: 'Procedimiento', clasificacion: 'Interno', age: 210, html: docTpl('SGC-PR-002', 'Auditorías internas', [

            ['Registro', '<table><tr><th>Código</th><th>Documento</th><th>Versión</th><th>Área</th></tr><tr><td>SGC-PR-001</td><td>Control de documentos</td><td>2</td><td>Calidad</td></tr><tr><td>SGC-PR-002</td><td>Auditorías internas</td><td>1</td><td>Calidad</td></tr><tr><td>RH-POL-003</td><td>Política de trabajo remoto</td><td>1</td><td>RH</td></tr></table>'],

          ['a_cal', 'PR', 'SGC-PYLG-001', 'Políticas y lineamientos generales del SGC', 'PyLG', 'Público', '2', 380, null],
          ['a_cal', 'FO', 'SGC-FO-020', 'Formato de solicitud de cambio documental', 'Formato', 'Interno', '1', 60, 'SGC-PR-001'],
          ['a_cal', 'IN', 'SGC-IN-001', 'Registro de indicadores de calidad 2026', 'Registro', 'Interno', '1', 3, 'SGC-PR-002'],
          ['a_fin', 'CON', 'FIN-CON-001', 'Cierre contable mensual', 'Procedimiento', 'Confidencial', '2', 330, null],
          ['a_fin', 'CON', 'FIN-CON-002', 'Hoja de verificación de cierre', 'Hoja de Verificación', 'Confidencial', '3', 150, 'FIN-CON-001'],
          ['a_fin', 'PRE', 'FIN-PRE-002', 'Plan presupuestal 2026', 'Plan', 'Confidencial', '4', 150, null],
          ['a_fin', 'TES', 'FIN-TES-003', 'Formato de control de caja chica', 'Formato', 'Interno', '1', 40, 'FIN-CON-001'],
          ['a_ope', 'LOG', 'OPE-LOG-002', 'Recepción de materiales', 'Procedimiento', 'Interno', '1', 25, null],
          ['a_ope', 'LOG', 'OPE-LOG-003', 'Bitácora de recepción', 'Bitácora', 'Interno', '2', 20, 'OPE-LOG-002'],
          ['a_ope', 'SEG', 'OPE-SEG-001', 'Uso de equipo de protección personal', 'Ayuda Visual', 'Público', '3', 260, 'OPE-LOG-002'],
          ['a_ope', 'MAN', 'OPE-MAN-004', 'Mantenimiento preventivo de montacargas', 'Instrucción de Operación', 'Interno', '2', 70, 'OPE-LOG-002'],
          ['a_ti', 'INF', 'TI-INF-001', 'Respaldo de servidores', 'Procedimiento', 'Confidencial', '2', 180, null],
          ['a_ti', 'DES', 'TI-DES-003', 'Estándares de desarrollo', 'Manual Técnico', 'Interno', '5', 8, null],
          ['a_jur', 'NOR', 'JUR-NOR-001', 'Lineamientos generales de cumplimiento', 'PyLG', 'Público', '1', 300, null],
          ['a_jur', 'CTR', 'JUR-CTR-010', 'Catálogo de cláusulas contractuales', 'Catálogo', 'Confidencial', '1', 290, 'JUR-NOR-001'],
          ['a_rh', 'CAP', 'RH-CAP-002', 'Plan anual de capacitación', 'Plan', 'Interno', '2', 120, null],
          ['a_rh', 'REC', 'RH-REC-001', 'Reclutamiento y selección', 'Procedimiento', 'Interno', '3', 55, null],

        ].map(([areaId, fcode, nomenclatura, nombre, tipo, clasificacion, version, age, rector]) => ({
          folder: folders.find(f => f.areaId === areaId && f.code === fcode), nomenclatura, nombre, tipo, clasificacion, version, age, rector,

        })),
      ];

      const docs = [];
      for (const [i, s] of sampleDocs.entries()) {
        const id = uid('d_');
        const date = now - (s.age ?? (10 - i)) * D;
        docs.push({
          id, areaId: s.folder.areaId, folderId: s.folder.id,
          nomenclatura: s.nomenclatura, nombre: s.nombre, version: s.version, tipo: s.tipo || '', categoria: (DEFAULT_TIPOS().find(t => t.name === s.tipo) || {}).cat || '', clasificacion: s.clasificacion || '', _rector: s.rector || null,
          fechaActualizacion: new Date(date).toISOString().slice(0, 10),
          subidoPor: ownerId, fileName: `${s.nomenclatura} ${s.nombre}.docx`, ext: 'docx',
          mime: 'text/html', size: s.html.length, editable: true,
          createdAt: date, updatedAt: date, updatedBy: ownerId,
          history: [{ v: s.version, at: date, by: ownerId, note: 'Publicación inicial', key: null }],
        });
        await Files.put('html:' + id, s.html);
      }

      docs.forEach(d => { d.rectorId = d._rector ? (docs.find(x => x.nomenclatura === d._rector) || {}).id || null : null; delete d._rector; });
      const uniq = (k) => [...new Set(docs.map(d => d[k]).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
      Object.assign(this.db, { areas, folders, docs, catalogs: { tipos: DEFAULT_TIPOS(), clasificaciones: uniq('clasificacion') } });
      this.db.audit.unshift({ id: uid('l_'), at: now, by: ownerId, action: 'sistema', text: 'Se cargaron áreas y documentos de ejemplo' });
    },
    /* Borra todo (metadatos, usuarios y archivos) y vuelve a la configuración inicial */
    async wipe() {
      LS.store.removeItem(KEY);
      await Files.clear();
      this.db = null;
    },
    log(by, action, text) {
      this.db.audit.unshift({ id: uid('l_'), at: Date.now(), by, action, text });
      this.db.audit = this.db.audit.slice(0, 400);
    },
    export() {
      return JSON.stringify(this.db, null, 2);
    },
  };

  function docTpl(code, title, sections) {
    return `<table><tr><td style="width:30%"><b>COMASW</b></td><td style="text-align:center"><b>${title.toUpperCase()}</b></td><td style="width:22%">Código: ${code}</td></tr></table>`
      + `<h1>${title}</h1>`
      + sections.map(([h, b]) => `<h2>${h}</h2>${b.startsWith('<') ? b : `<p>${b}</p>`}`).join('');
  }

  window.Repo = Repo;
  window.Files = Files;
  window.defaultSettings = defaultSettings;
  window.DEFAULT_TIPOS = DEFAULT_TIPOS;
  window.CATEGORIAS = CATEGORIAS;
})();

</script>

  const LV = { ver: 1, descargar: 2, editar: 3 };
  const LV_LABEL = { ver: 'Solo ver', descargar: 'Ver y descargar', editar: 'Edición en línea' };
  const LV_ICON = { ver: 'eye', descargar: 'download', editar: 'pencil-line' };

  const cssVars = (color) => { const [a, b] = COLORS[color] || COLORS.blue; return `--c1:${a};--c2:${b}`; };
  const fmtDate = (t) => t ? new Date(t).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
  const fmtDateTime = (t) => t ? new Date(t).toLocaleString('es-MX', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  const fmtSize = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
  const fmtLeft = (ms) => {
    const m = Math.round(ms / 60000); if (m < 60) return `${Math.max(m, 1)} min`;
    const h = Math.floor(m / 60); if (h < 48) return `${h} h ${m % 60 ? (m % 60) + ' min' : ''}`.trim();
    const d = Math.floor(h / 24); return `${d} d ${h % 24 ? (h % 24) + ' h' : ''}`.trim();
  };
  const fmtRel = (t) => {
    const s = (now() - t) / 1000; if (s < 60) return 'hace un momento';
    if (s < 3600) return `hace ${Math.round(s / 60)} min`; if (s < 86400) return `hace ${Math.round(s / 3600)} h`;
    if (s < 86400 * 7) return `hace ${Math.round(s / 86400)} d`; return fmtDate(t);
  };
  const initials = (n) => String(n || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const extOf = (n) => (String(n).split('.').pop() || '').toLowerCase();
  const toLocalInput = (t) => { const d = new Date(t); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };

  window.toast = function (msg, type = 'ok') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = ic(type === 'err' ? 'circle-alert' : type === 'info' ? 'info' : 'circle-check') + `<span>${esc(msg)}</span>`;
    $('#toasts').appendChild(el); icons();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 3200);
  };

  /* ---------------- Estado ---------------- */
  Repo.load();
  let S = Repo.db;
  const intVersion = (v) => String(Math.max(1, parseInt(String(v ?? '').replace(/[^0-9.]/g, ''), 10) || 1));
  function migrate() {
    if (!S) return;
    S.settings = { ...defaultSettings(), ...S.settings };
    if (S.settings.appName === 'Acervo') S.settings.appName = 'FileHub';
    // Dominio único (versiones anteriores) → lista de dominios configurables
    if (!Array.isArray(S.settings.domains)) S.settings.domains = S.settings.domain ? [String(S.settings.domain).toLowerCase()] : [];
    delete S.settings.domain;
    S.settings.versionInicial = intVersion(S.settings.versionInicial);
    S.catalogs = S.catalogs || { tipos: [], clasificaciones: [] };
    // Tipos ahora son {name, cat}; los catálogos antiguos (texto libre) se reemplazan por el catálogo oficial por niveles
    if (!Array.isArray(S.catalogs.tipos) || !S.catalogs.tipos.length || S.catalogs.tipos.some(t => typeof t !== 'object')) S.catalogs.tipos = DEFAULT_TIPOS();
    S.catalogs.clasificaciones = S.catalogs.clasificaciones || [];
    for (const d of S.docs) {
      d.tipo = d.tipo || ''; d.clasificacion = d.clasificacion || '';
      d.version = intVersion(d.version);
      (d.history || []).forEach(h => h.v = intVersion(h.v));
      d.categoria = catOfTipo(d.tipo) || d.categoria || '';
      if (d.rectorId === undefined) d.rectorId = null;
      if (d.clasificacion) addToCatalog('clasificaciones', d.clasificacion);
    }
    for (const d of S.docs) if (d.rectorId && !S.docs.some(x => x.id === d.rectorId)) d.rectorId = null;
  }

  const CAT_COLOR = { 'Estratégico': '#bf5af2', 'Operativo': '#0a84ff', 'Soporte': '#30d158' };
  const CAT_CLASS = { 'Estratégico': 'cat-est', 'Operativo': 'cat-ope', 'Soporte': 'cat-sop' };
  function catOfTipo(t) { return ((S && S.catalogs && Array.isArray(S.catalogs.tipos) ? S.catalogs.tipos : []).find(x => typeof x === 'object' && x.name === t) || {}).cat || ''; }
  const isRectorCat = (c) => c === 'Estratégico' || c === 'Operativo';
  const childrenOf = (id) => S.docs.filter(d => d.rectorId === id);
  const catChip = (c) => c ? `<span class="chip ${CAT_CLASS[c] || ''}">${esc(c)}</span>` : '<span class="tiny">—</span>';
  function addToCatalog(kind, v) {
    v = String(v || '').trim(); if (!v) return '';
    const list = S.catalogs[kind];
    const hit = list.find(x => x.toLowerCase() === v.toLowerCase());
    if (hit) return hit;
    list.push(v); list.sort((a, b) => a.localeCompare(b, 'es')); return v;
  }
  migrate();
  let me = null;
  const route = { view: 'home', areaId: null, folderId: null, tab: 'general', q: '' };
  const ui = { docView: 'list', sort: 'recent', filter: '' };

  function applyTheme() {
    let t = S?.settings?.theme || 'auto';
    if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }
  applyTheme();

  const userById = (id) => S.users.find(u => u.id === id);
  const userName = (id) => userById(id)?.name || 'Usuario eliminado';
  const areaById = (id) => S.areas.find(a => a.id === id);
  const folderById = (id) => S.folders.find(f => f.id === id);
  const roleOf = (u = me) => S.roles.find(r => r.id === u?.role) || { caps: {}, name: 'Sin perfil' };
  const can = (cap, u = me) => !!roleOf(u).caps[cap];
  const save = () => Repo.save();
  /* Protección anti-bloqueo: siempre debe existir al menos un usuario activo
     cuyo perfil pueda asignar permisos y entrar a configuración. */
  const isAdminUser = (u, roles = S.roles) => { const r = roles.find(x => x.id === u.role); return !!(u.active && r && r.caps.settings && r.caps.managePerms); };
  const keepsAdmin = (users = S.users, roles = S.roles) => users.some(u => isAdminUser(u, roles));
  const ADMIN_MSG = 'Debe quedar al menos un usuario activo con perfil de administración';
  function logout(msg) { me = null; SessionStore.removeItem(SESSION); render(); if (msg) toast(msg, 'info'); }
  const log = (action, text) => Repo.log(me?.id, action, text);

  function grantStatus(g) {
    if (g.revoked) return 'revocado';
    if (g.type === 'temporal' && g.expiresAt && g.expiresAt <= now()) return 'expirado';
    return 'vigente';
  }
  function areaAccess(areaId, u = me) {
    if (!u) return { level: null, status: 'sin' };
    if (can('allAreas', u)) return { level: 'editar', status: 'vigente', full: true };
    const gs = S.grants.filter(g => g.userId === u.id && g.areaId === areaId && !g.revoked);
    let best = null, expired = null;
    for (const g of gs) {
      const st = grantStatus(g);
      if (st === 'vigente') { if (!best || LV[g.level] > LV[best.level]) best = g; }
      else if (st === 'expirado') { if (!expired || g.expiresAt > expired.expiresAt) expired = g; }
    }
    if (best) return { level: best.level, status: 'vigente', grant: best };
    if (expired) return S.settings.expiredBehavior === 'ver'
      ? { level: 'ver', status: 'expirado-ver', grant: expired }
      : { level: null, status: 'expirado', grant: expired };
    return { level: null, status: 'sin' };
  }
  const canUploadIn = (areaId) => can('upload') && areaAccess(areaId).level === 'editar';
  const canFolderIn = (areaId) => can('createFolder') && areaAccess(areaId).level === 'editar';
  const visibleAreas = () => S.areas
    .filter(a => areaAccess(a.id).level || (S.settings.showLockedAreas && areaAccess(a.id).status === 'expirado') || can('managePerms'))
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

  function accessChip(acc) {
    if (acc.full) return `<span class="chip accent">${ic('shield-check')}Acceso total</span>`;
    if (acc.status === 'expirado') return `<span class="chip danger">${ic('lock')}Acceso expirado</span>`;
    if (acc.status === 'expirado-ver') return `<span class="chip warn">${ic('clock')}Expirado · solo ver</span>`;
    if (!acc.level) return `<span class="chip">${ic('lock')}Sin acceso</span>`;
    const g = acc.grant;
    const exp = g?.type === 'temporal' ? ` · ${fmtLeft(g.expiresAt - now())}` : '';
    const cls = g?.type === 'temporal' && g.expiresAt - now() < 864e5 ? 'warn' : 'ok';
    return `<span class="chip ${cls}">${ic(LV_ICON[acc.level])}${LV_LABEL[acc.level]}${exp}</span>`;
  }

  const LOGO = `<img class="logo-img" src="${LOGO_SRC}" alt="FileHub" width="32" height="32"/>`;
  (() => { const l = document.querySelector('link[rel=icon]'); if (l) { l.type = 'image/png'; l.href = LOGO_SRC; } })();

  /* ---------------- Modales ---------------- */
  function openModal({ title, sub = '', body = '', foot = '', size = '', icon = '', onMount, onClose, dismissable = true }) {
    const root = document.createElement('div');
    root.className = 'modal-root';
    root.innerHTML = `<div class="modal-backdrop"></div>
      <div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        ${title ? `<div class="modal-head">${icon}<div><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ''}</div>
        <button class="icon-btn" data-close aria-label="Cerrar">${ic('x')}</button></div>` : ''}
        <div class="modal-body">${body}</div>
        ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
      </div>`;
    $('#modals').appendChild(root);
    const m = $('.modal', root);
    let closed = false;
    const close = () => {
      if (closed) return; closed = true;
      root.classList.add('closing'); m.classList.add('closing');
      document.removeEventListener('keydown', onKey);
      setTimeout(() => { root.remove(); onClose && onClose(); }, 240);
    };
    const onKey = (e) => { if (e.key === 'Escape' && dismissable && root === $('#modals').lastElementChild) close(); };
    document.addEventListener('keydown', onKey);
    $('.modal-backdrop', root).addEventListener('click', () => dismissable && close());
    $$('[data-close]', root).forEach(b => b.addEventListener('click', close));
    icons();
    const ctx = { root, el: m, close, $: (s) => $(s, m), $$: (s) => $$(s, m) };
    onMount && onMount(ctx);
    setTimeout(() => { const f = $('input:not([type=hidden]):not([readonly]):not([type=checkbox]):not([type=radio]), textarea', m); f && f.focus(); }, 80);
    return ctx;
  }

  function confirmDialog({ title, text, ok = 'Confirmar', danger = false }) {
    return new Promise(res => {
      let answered = false;
      openModal({
        title, sub: text,
        foot: `<button class="btn btn-secondary" data-close>Cancelar</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${ok}</button>`,
        onMount: (c) => c.$('[data-ok]').addEventListener('click', () => { answered = true; res(true); c.close(); }),
        onClose: () => !answered && res(false),
      });
    });
  }

  /* Menú contextual */
  function openMenu(anchor, items) {
    closeMenu();
    const r = anchor.getBoundingClientRect();
    const m = document.createElement('div');
    m.className = 'ctx';
    m.innerHTML = `<div class="dropdown" style="position:static;min-width:210px">${items.map((it, i) => it === '-' ? '<div style="height:1px;background:var(--line);margin:6px 4px"></div>'
      : `<button class="dropdown-item ${it.danger ? 'danger' : ''}" data-i="${i}">${ic(it.icon)}${esc(it.label)}</button>`).join('')}</div>`;
    document.body.appendChild(m);
    const w = 220; const left = Math.min(r.right - w, innerWidth - w - 12);
    m.style.left = Math.max(12, left) + 'px';
    const top = r.bottom + 6; m.style.top = (top + m.offsetHeight > innerHeight ? r.top - m.offsetHeight - 6 : top) + 'px';
    icons();
    m.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) { closeMenu(); items[+b.dataset.i].run(); } });
    setTimeout(() => document.addEventListener('click', closeMenu, { once: true }), 0);
  }
  function closeMenu() { $$('.ctx').forEach(x => x.remove()); }

  /* ---------------- Render principal ---------------- */
  function render() {
    closeMenu();
    const app = $('#app');
    if (!S) { app.innerHTML = setupView(); bindSetup(); icons(); return; }
    if (!me) { app.innerHTML = loginView(); bindLogin(); icons(); return; }
    let content = '';
    if (route.view === 'home') content = homeView();
    else if (route.view === 'area') content = areaView();
    else if (route.view === 'folder') content = folderView();
    else if (route.view === 'dashboard') content = dashboardView();
    else if (route.view === 'settings') content = settingsView();
    else if (route.view === 'search') content = searchView();
    app.innerHTML = navView() + `<main class="main"><div class="view" id="view">${content}</div></main>`;
    icons();
    bindView();
  }

  function go(view, params = {}) {
    Object.assign(route, { view }, params);
    render();
    scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------------- Login ---------------- */
  function loginView() {
    const st = S.settings;
    return `<div class="login">
      <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
      <form class="login-card" id="loginForm" novalidate>
        <div class="logo">${LOGO}</div>
        <h1>${esc(st.appName)}</h1>
        <p>Repositorio documental${st.orgName ? ' de ' + esc(st.orgName) : ''}</p>
        <div class="field"><label for="lEmail">Correo corporativo</label>
          <input class="input" id="lEmail" type="email" autocomplete="username" placeholder="nombre@${esc(st.domains[0] || 'empresa.com')}" required /></div>
        <div class="field"><label for="lPass">Contraseña</label>
          <div class="input-icon"><input class="input" id="lPass" type="password" autocomplete="current-password" placeholder="••••••••" required />
          <button type="button" class="icon-btn" data-toggle-pass aria-label="Mostrar contraseña">${ic('eye')}</button></div></div>
        <div class="err hidden" id="lErr" style="color:var(--danger);font-size:13px;margin:-4px 0 12px;text-align:left"></div>
        <button class="btn btn-primary btn-lg" type="submit">Iniciar sesión ${ic('arrow-right')}</button>
        <div class="demo-users" style="text-align:center">¿Olvidaste tu contraseña? Solicita a un administrador que la restablezca.</div>
      </form></div>`;
  }

  const EMAIL_RE = /^[a-z0-9._%+-]+@[a-z0-9-]+(\.[a-z0-9-]+)+$/;
  const DOMAIN_RE = /^[a-z0-9-]+(\.[a-z0-9-]+)+$/;

  /* ---------------- Configuración inicial (primer uso) ---------------- */
  function setupView() {
    const d = defaultSettings();
    return `<div class="login">
      <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
      <form class="login-card" id="setupForm" novalidate style="max-width:480px">
        <div class="logo">${LOGO}</div>
        <h1>Bienvenido a ${esc(d.appName)}</h1>
        <p>Crea la cuenta del administrador. Ninguna contraseña viene incluida en el código. La organización y los dominios de correo permitidos se configuran después en Configuración.</p>
        <div class="field"><label for="sName">Nombre del administrador</label><input class="input" id="sName" placeholder="Ej. Juan Pérez" required autocomplete="name"/></div>
        <div class="field"><label for="sUser">Correo del administrador</label><input class="input" id="sUser" type="email" placeholder="nombre@empresa.com" required autocomplete="username"/><div class="hint">Con este correo iniciarás sesión</div></div>
        <div class="row"><div class="field"><label for="sPass">Contraseña</label><div class="input-icon"><input class="input" id="sPass" type="password" required autocomplete="new-password" placeholder="Mínimo ${d.minPassword}"/><button type="button" class="icon-btn" data-toggle-pass aria-label="Mostrar contraseña">${ic('eye')}</button></div></div>
          <div class="field"><label for="sPass2">Confirmar</label><input class="input" id="sPass2" type="password" required autocomplete="new-password"/></div></div>
        <label class="set-row" style="border:0;padding:4px 0 14px;cursor:pointer;text-align:left"><span class="txt"><strong>Cargar áreas de ejemplo</strong><span>Áreas, carpetas y documentos de muestra. Sin usuarios.</span></span><span class="switch"><input type="checkbox" id="sSamples" checked/><span></span></span></label>
        <div class="err hidden" id="sErr" style="color:var(--danger);font-size:13px;margin:-4px 0 12px;text-align:left"></div>
        <button class="btn btn-primary btn-lg" type="submit">Crear repositorio ${ic('arrow-right')}</button>
      </form></div>`;
  }
  function bindSetup() {
    const f = $('#setupForm');
    $('[data-toggle-pass]').addEventListener('click', (e) => togglePass(e.currentTarget, $('#sPass')));
    $('#sUser').addEventListener('input', (e) => { e.target.value = e.target.value.toLowerCase().replace(/\s/g, ''); });
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = (m, el) => { const x = $('#sErr'); x.textContent = m; x.classList.remove('hidden'); el && el.classList.add('invalid'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); };
      $$('.invalid', f).forEach(x => x.classList.remove('invalid'));
      const email = $('#sUser').value.trim().toLowerCase();
      const name = $('#sName').value.trim();
      const pass = $('#sPass').value, pass2 = $('#sPass2').value;
      const min = defaultSettings().minPassword;
      if (!name) return err('Escribe el nombre del administrador', $('#sName'));
      if (!EMAIL_RE.test(email)) return err('Escribe un correo válido para el administrador', $('#sUser'));
      if (pass.length < min) return err(`La contraseña debe tener al menos ${min} caracteres`, $('#sPass'));
      if (!/[A-Za-z]/.test(pass) || !/[0-9]/.test(pass)) return err('La contraseña debe combinar letras y números', $('#sPass'));
      if (pass !== pass2) return err('Las contraseñas no coinciden', $('#sPass2'));
      const btn = $('button[type=submit]', f); btn.disabled = true; btn.textContent = 'Creando…';
      await Repo.init({ email, name, pass }, $('#sSamples').checked);
      S = Repo.db; migrate(); me = S.users[0]; SessionStore.setItem(SESSION, me.id); me.lastLogin = now(); save();
      applyTheme(); go('home'); toast('Repositorio creado');
    });
  }
  const loginLock = { fails: 0, until: 0 };
  function bindLogin() {
    const f = $('#loginForm');
    $('[data-toggle-pass]').addEventListener('click', (e) => togglePass(e.currentTarget, $('#lPass')));
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('#lEmail').value.trim().toLowerCase();
      const pass = $('#lPass').value;
      const err = (m) => { const x = $('#lErr'); x.textContent = m; x.classList.remove('hidden'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); };
      if (!EMAIL_RE.test(email)) return err('Escribe un correo válido');
      const u = S.users.find(x => x.email === email);
      if (loginLock.until > now()) return err(`Demasiados intentos. Espera ${Math.ceil((loginLock.until - now()) / 1000)} s.`);
      if (!u || !(await Repo.verifyPassword(pass, u.pass))) {
        loginLock.fails++;
        if (loginLock.fails >= 5) { loginLock.until = now() + 30000; loginLock.fails = 0; }
        return err('Correo o contraseña incorrectos');
      }
      loginLock.fails = 0;
      if (!u.active) return err('Esta cuenta está desactivada. Contacta al administrador.');
      me = u; SessionStore.setItem(SESSION, u.id);
      u.lastLogin = now(); log('acceso', `Inicio de sesión`); save();
      go('home');
      toast(`Hola, ${u.name.split(' ')[0]}`);
    });
  }
  function togglePass(btn, input) {
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.innerHTML = ic(input.type === 'password' ? 'eye' : 'eye-off'); icons();
  }

  /* ---------------- Navegación ---------------- */
  function navView() {
    const st = S.settings;
    const settingsOk = can('settings') || can('managePerms');
    return `<header class="nav"><div class="nav-inner">
      <button class="brand" data-act="home">${LOGO}<span>${esc(st.appName)}</span>${st.orgName ? `<small>${esc(st.orgName)}</small>` : ''}</button>
      <nav class="nav-links">
        <button class="nav-link ${['home', 'area', 'folder', 'search'].includes(route.view) ? 'active' : ''}" data-act="home">Repositorio</button>

      </nav>
      <div class="nav-spacer"></div>
      <label class="search">${ic('search')}<span class="sr">Buscar</span><input id="q" placeholder="Buscar documentos" value="${esc(route.view === 'search' ? route.q : '')}" /></label>
      ${can('managePerms') ? `<button class="icon-btn" data-act="grant" title="Asignar permisos" aria-label="Asignar permisos">${ic('user-plus')}</button>` : ''}
      <button class="icon-btn" data-act="theme" title="Cambiar tema" aria-label="Cambiar tema">${ic(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon')}</button>
