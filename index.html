    });
  }

  /* ---------------- Descargas ---------------- */
  function downloadMenu(anchor, d, lvl, historyEntry) {
    const items = [{ icon: 'file-text', label: 'Descargar PDF', run: () => downloadDoc(d, 'pdf', historyEntry) }];
    if (lvl === 'editar' || S.settings.downloadFormat === 'original') {
      items.push({ icon: 'file', label: `Archivo original (.${d.ext})`, run: () => downloadDoc(d, 'original', historyEntry) });
      if (d.editable) items.push({ icon: 'file-type', label: 'Word editable (.doc)', run: () => downloadDoc(d, 'word', historyEntry) });
    }
    openMenu(anchor, items);
  }
  const saveBlob = (blob, name) => { const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); };
  const safeName = (d) => `${d.nomenclatura} ${d.nombre} ${d.version}`.replace(/[\\/:*?"<>|]+/g, '-');

  async function downloadDoc(d, format = 'pdf', historyEntry = null) {
    const acc = areaAccess(d.areaId);
    if (LV[acc.level] < 2) return toast('Tu permiso no incluye descargas', 'err');
    if (format !== 'pdf' && acc.level !== 'editar' && S.settings.downloadFormat !== 'original') format = 'pdf';
    let html, blob, ext = d.ext;
    if (historyEntry) { const h = await Files.get(historyEntry.key); html = h?.html; blob = h?.orig; ext = h?.ext || ext; }
    else { html = d.editable ? await Files.get('html:' + d.id) : null; blob = await Files.get('orig:' + d.id); }
    const name = safeName(d);
    log('descarga', `Descargó ${d.nomenclatura} (${format.toUpperCase()})`); save();

    if (format === 'original') {
      if (blob) return saveBlob(blob, d.fileName);
      format = 'word';
    }
    if (format === 'word') {
      const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(d.nombre)}</title></head><body>${html || ''}</body></html>`;
      return saveBlob(new Blob(['\ufeff', doc], { type: 'application/msword' }), name + '.doc');
    }
    // PDF
    if (!html && blob && ext === 'pdf') return saveBlob(blob, name + '.pdf');
    let content = html;
    if (!content && blob && ['png', 'jpg', 'jpeg', 'webp'].includes(ext)) {
      const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      content = `<img src="${dataUrl}" style="max-width:100%"/>`;
    }
    if (!content) return toast(`No es posible convertir .${ext} a PDF en el navegador`, 'err');
    if (!window.html2pdf) return toast('El generador de PDF no está disponible', 'err');
    toast('Generando PDF…', 'info');
    const exp = acc.grant?.type === 'temporal' ? acc.grant.expiresAt : null;
    const footer = `${d.nomenclatura} · Versión ${historyEntry ? historyEntry.v : d.version} · Descargado por ${me.email} el ${fmtDateTime(now())}${exp ? ' · Vigencia del acceso: ' + fmtDateTime(exp) : ''}`;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'font-family:Georgia,serif;font-size:11.5pt;line-height:1.55;color:#111;padding:0 2mm';
    wrap.innerHTML = `<style>table{border-collapse:collapse;width:100%;margin:8px 0;font-family:Helvetica,Arial,sans-serif;font-size:9.5pt}td,th{border:1px solid #bbb;padding:4px 6px;vertical-align:top}th{background:#f2f2f2}h1{font-family:Helvetica,Arial,sans-serif;font-size:20pt;margin:10px 0 6px}h2{font-family:Helvetica,Arial,sans-serif;font-size:14pt;margin:14px 0 4px}h3{font-family:Helvetica,Arial,sans-serif}p{margin:0 0 8px}ul,ol{margin:0 0 8px;padding-left:24px}li{margin-bottom:3px}img{max-width:100%}tr,img{page-break-inside:avoid}</style>${content}`;
    const wmText = S.settings.watermark && acc.level !== 'editar' ? me.email : null;
    await html2pdf().set({
      margin: [16, 14, 18, 14], filename: name + '.pdf', image: { type: 'jpeg', quality: 0.96 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' }, jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] },
    }).from(wrap).toPdf().get('pdf').then(pdf => {
      const n = pdf.internal.getNumberOfPages();
      const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
      for (let i = 1; i <= n; i++) {
        pdf.setPage(i);
        if (wmText) { pdf.setFontSize(30); pdf.setTextColor(225, 225, 230); pdf.text(wmText, W / 2 - 55, H / 2 + 30, { angle: 35 }); }
        pdf.setFontSize(7.5); pdf.setTextColor(130); pdf.text(footer, 14, H - 8, { maxWidth: W - 40 }); pdf.text(`${i}/${n}`, W - 20, H - 8);
      }
      saveBlob(pdf.output('blob'), name + '.pdf');
    });
  }

  /* ---------------- Permisos ---------------- */
  function genPassword() {
    const c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%';
    return Array.from(crypto.getRandomValues(new Uint32Array(12))).map(x => c[x % c.length]).join('');
  }

  function grantModal(user = null, preAreas = []) {
    if (!can('managePerms')) return toast('No tienes permiso para asignar accesos', 'err');
    const st = S.settings; const isNew = !user;
    const curGrants = user ? S.grants.filter(g => g.userId === user.id && grantStatus(g) !== 'revocado') : [];
    const defExp = now() + st.defaultTempHours * 3600e3;
    // Solo dominios configurados; al editar una cuenta existente se conserva su dominio aunque ya no esté en la lista
    const curDom = user ? user.email.split('@')[1] : st.domains[0];
    const doms = [...st.domains]; if (user && curDom && !doms.includes(curDom)) doms.push(curDom);
    openModal({
      size: 'wide', icon: `<div class="file-badge" style="background:linear-gradient(135deg,#5e5ce6,#bf5af2);width:44px;height:44px;border-radius:13px">${ic('key-round')}</div>`,
      title: isNew ? 'Asignar permisos' : 'Editar acceso', sub: isNew ? 'Crea o actualiza una cuenta y define a qué áreas puede acceder.' : esc(user.email),
      body: `<form id="gf" novalidate autocomplete="off">
        <div class="row">
          <div class="field"><label for="gEmail">Usuario</label>
            <div class="email-split"><input class="input" id="gEmail" name="email" value="${esc(user ? user.email.split('@')[0] : '')}" placeholder="nombre.apellido" autocomplete="off" ${doms.length ? '' : 'disabled'}/>
              <select class="select" name="domain" aria-label="Dominio" ${doms.length ? '' : 'disabled'}>${doms.length ? doms.map(d => `<option value="${esc(d)}" ${d === curDom ? 'selected' : ''}>@${esc(d)}${st.domains.includes(d) ? '' : ' (no configurado)'}</option>`).join('') : '<option>Sin dominios</option>'}</select></div>
            <div class="hint" id="gEmailHint">${doms.length ? 'Solo se muestran los dominios configurados' : ''}</div></div>
          <div class="field"><label for="gName">Nombre completo</label><input class="input" id="gName" name="name" value="${esc(user?.name || '')}" placeholder="Ej. Ana López"/></div>
        </div>
        <div class="row">
          <div class="field"><label for="gPass">Contraseña</label>
            <div class="input-icon"><input class="input mono" id="gPass" name="pass" type="password" placeholder="${user ? 'Dejar vacío para conservar' : 'Mínimo ' + st.minPassword + ' caracteres'}" autocomplete="new-password"/>
            <button type="button" class="icon-btn" data-eye aria-label="Mostrar">${ic('eye')}</button></div>
            <div class="chips-quick"><button type="button" data-gen>${ic('sparkles')} Generar segura</button></div></div>
          <div class="field"><label for="gRole">Perfil</label><select class="select" id="gRole" name="role">${S.roles.map(r => `<option value="${r.id}" ${(user?.role || 'consulta') === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select>
            <div class="hint" id="roleHint"></div></div>
        </div>
        ${doms.length ? '' : `<div class="notice-warn">${ic('triangle-alert')}<div><strong>No hay dominios de correo configurados.</strong><br/>Agrega al menos uno en Configuración → General para poder crear usuarios.${can('settings') ? ' <button type="button" class="btn-ghost" data-go-domains>Ir a configurar</button>' : ''}</div></div>`}
        ${curGrants.length ? `<div class="field"><span class="label">Accesos actuales</span><div class="grants" style="padding:12px;background:var(--bg);border-radius:12px">${curGrants.map(g => grantLine(g, true)).join('')}</div></div>` : ''}
        <div class="field"><div style="display:flex;justify-content:space-between;align-items:center"><span class="label">${curGrants.length ? 'Agregar o actualizar áreas' : 'Tarjetas (áreas) con acceso'}</span><button type="button" class="btn-ghost btn btn-sm" data-all>Seleccionar todas</button></div>
          <div class="area-picks">${S.areas.map(a => `<label class="area-pick" style="${cssVars(a.color)}"><input type="checkbox" name="areas" value="${a.id}" ${preAreas.includes(a.id) ? 'checked' : ''}/><span class="dot">${ic(a.icon)}</span>${esc(a.name)}<span class="chk">${ic('check')}</span></label>`).join('')}</div></div>
        <div class="field"><span class="label">Nivel de acceso</span><div class="option-cards">
          ${['ver', 'descargar', 'editar'].map((l, i) => `<label class="opt"><input type="radio" name="level" value="${l}" ${i === 0 ? 'checked' : ''}/><span class="t">${ic(LV_ICON[l])}${['Ver', 'Descargar', 'Editar en línea'][i]}</span><span class="d">${['Consulta en pantalla, sin copiar ni imprimir.', `Ver y descargar en ${st.downloadFormat === 'pdf' ? 'PDF' : 'formato original'}.`, 'Modificar el documento y guardar nuevas versiones.'][i]}</span></label>`).join('')}</div></div>
        <div class="field"><span class="label">Vigencia</span><div class="option-cards two">
          <label class="opt"><input type="radio" name="type" value="permanente" checked/><span class="t">${ic('infinity')}Permanente</span><span class="d">Sin fecha de fin. Revocable en cualquier momento.</span></label>
          <label class="opt"><input type="radio" name="type" value="temporal"/><span class="t">${ic('timer')}Temporal</span><span class="d">Expira automáticamente en la fecha indicada.</span></label></div>
          <div class="reveal" id="tempBox"><div><div style="padding-top:14px">
            <label class="label" for="gExp">Expira el</label><input class="input" type="datetime-local" id="gExp" name="exp" value="${toLocalInput(defExp)}" min="${toLocalInput(now())}"/>
            <div class="chips-quick">${[['1 h', 1], ['8 h', 8], ['24 h', 24], ['3 días', 72], ['7 días', 168], ['30 días', 720], ['90 días', 2160]].map(([t, h]) => `<button type="button" data-h="${h}">${t}</button>`).join('')}</div>
            <div class="hint" id="expHint"></div>
          </div></div></div></div>
        <div class="hint" id="summary" style="font-size:13px;padding:12px 14px;background:var(--accent-soft);color:var(--accent);border-radius:12px"></div>
      </form>`,
      foot: `<button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" data-save>${ic('check')}Guardar permisos</button>`,
      onMount: (c) => {
        const f = c.$('#gf');
        const roleHint = () => { const r = S.roles.find(x => x.id === f.role.value); c.$('#roleHint').textContent = r?.desc || ''; };
        f.role.addEventListener('change', () => { roleHint(); summary(); }); roleHint();
        c.$('[data-eye]').addEventListener('click', (e) => togglePass(e.currentTarget, f.pass));
        c.$('[data-gen]').addEventListener('click', () => { f.pass.value = genPassword(); f.pass.type = 'text'; c.$('[data-eye]').innerHTML = ic('eye-off'); icons(); });
        c.$('[data-all]').addEventListener('click', () => { const boxes = c.$$('[name=areas]'); const all = boxes.every(b => b.checked); boxes.forEach(b => b.checked = !all); summary(); });
        f.email.addEventListener('input', () => {
          let v = f.email.value;
          if (v.includes('@')) {
            const [u, dmn] = v.split('@'); f.email.value = u;
            if (dmn && doms.includes(dmn.toLowerCase())) f.domain.value = dmn.toLowerCase();
            else if (dmn) { badDom = true; c.$('#gEmailHint').innerHTML = `<span style="color:var(--danger)">"@${esc(dmn)}" no es un dominio configurado; elige uno de la lista</span>`; }
          }
          f.email.value = f.email.value.toLowerCase().replace(/[^a-z0-9._-]/g, '');
          if (!badDom) emailHint(); badDom = false; summary();
        });
        let badDom = false;
        f.domain.addEventListener('change', () => { emailHint(); summary(); });
        function emailHint() {
          const ex = S.users.find(u => u.email === f.email.value + '@' + f.domain.value);
          if (ex && isNew) c.$('#gEmailHint').innerHTML = `<span style="color:var(--warn)">Cuenta existente (${esc(ex.name)}): se actualizarán sus accesos</span>`;
          else if (doms.length) c.$('#gEmailHint').textContent = 'Solo se muestran los dominios configurados';
        }
        c.$('[data-go-domains]')?.addEventListener('click', () => { c.close(); go('settings', { tab: 'general' }); });
        if (!doms.length) c.$('[data-save]').disabled = true;
        const tempBox = c.$('#tempBox');
        c.$$('[name=type]').forEach(r => r.addEventListener('change', () => { tempBox.classList.toggle('open', f.type.value === 'temporal'); summary(); }));
        c.$$('[data-h]').forEach(b => b.addEventListener('click', () => { f.exp.value = toLocalInput(now() + (+b.dataset.h) * 3600e3); c.$$('[data-h]').forEach(x => x.classList.toggle('on', x === b)); summary(); }));
        f.exp.addEventListener('change', summary);
        c.$$('[name=areas],[name=level]').forEach(x => x.addEventListener('change', summary));
        c.$$('[data-revoke]').forEach(b => b.addEventListener('click', () => { revokeGrant(b.dataset.revoke); b.closest('.grant').style.opacity = .35; b.remove(); }));
        function summary() {
          const areas = c.$$('[name=areas]:checked').map(x => areaById(x.value).name);
          const lv = f.level.value, tp = f.type.value;
          const r = S.roles.find(x => x.id === f.role.value);
          const exp = new Date(f.exp.value).getTime();
          c.$('#expHint').textContent = tp === 'temporal' && exp > now() ? `Expira en ${fmtLeft(exp - now())}. Después no podrá abrir los documentos.` : '';
          const who = f.email.value && doms.length ? `${f.email.value}@${f.domain.value}` : 'El usuario';
          c.$('#summary').innerHTML = r?.caps.allAreas ? `${ic('shield-check')} <b>${esc(who)}</b> tendrá acceso total por su perfil ${esc(r.name)}.`
            : areas.length ? `<b>${esc(who)}</b> podrá <b>${LV_LABEL[lv].toLowerCase()}</b> en ${areas.map(esc).join(', ')} — ${tp === 'temporal' ? `hasta el ${fmtDateTime(exp)}` : 'de forma permanente (revocable)'}`
              : curGrants.length ? 'Selecciona áreas para agregar o actualizar accesos, o guarda para conservar los actuales.' : 'Selecciona al menos un área.';
          icons();
        }
        summary();
        c.$('[data-save]').addEventListener('click', async () => {
          const local = f.email.value.trim().toLowerCase();
          if (!doms.length) return toast('Configura al menos un dominio de correo en Configuración → General', 'err');
          const dmn = f.domain.value;
          if (!doms.includes(dmn)) return toast('Elige un dominio configurado', 'err');
          const email = `${local}@${dmn}`;
          if (!local || !/^[a-z0-9._-]+$/.test(local)) { f.email.classList.add('invalid'); return toast('Escribe un nombre de usuario válido', 'err'); }
          let u = user || S.users.find(x => x.email === email);
          if (user && email !== user.email && S.users.some(x => x.email === email)) { f.email.classList.add('invalid'); return toast('Ya existe otra cuenta con ese correo', 'err'); }
          const pass = f.pass.value;
          if (!u && pass.length < st.minPassword) { f.pass.classList.add('invalid'); return toast(`La contraseña debe tener al menos ${st.minPassword} caracteres`, 'err'); }
          if (u && pass && pass.length < st.minPassword) { f.pass.classList.add('invalid'); return toast(`La contraseña debe tener al menos ${st.minPassword} caracteres`, 'err'); }
          const areas = c.$$('[name=areas]:checked').map(x => x.value);
          const role = S.roles.find(x => x.id === f.role.value);
          if (!areas.length && !role.caps.allAreas && !curGrants.length && !u) return toast('Selecciona al menos un área', 'err');
          const type = f.type.value; const expiresAt = type === 'temporal' ? new Date(f.exp.value).getTime() : null;
          if (type === 'temporal' && (!expiresAt || expiresAt <= now())) { f.exp.classList.add('invalid'); return toast('La fecha de expiración debe ser futura', 'err'); }
          if (u && !keepsAdmin(S.users.map(x => x.id === u.id ? { ...x, role: role.id } : x))) return toast(ADMIN_MSG, 'err');
          const name = f.name.value.trim() || local.replace(/[._-]+/g, ' ').replace(/\b\w/g, m => m.toUpperCase());
          if (!u) { u = { id: Repo.uid('u_'), email, name, role: role.id, pass: await Repo.hashPassword(pass), active: true, createdAt: now(), createdBy: me.id }; S.users.push(u); log('usuario', `Creó la cuenta ${email}`); }
          else { const old = u.email; u.email = email; u.name = name; u.role = role.id; if (pass) u.pass = await Repo.hashPassword(pass); log('usuario', `Actualizó la cuenta ${email}${old !== email ? ` (antes ${old})` : ''}${pass ? ' y su contraseña' : ''}`); }
          for (const aid of areas) {
            S.grants.filter(g => g.userId === u.id && g.areaId === aid && !g.revoked).forEach(g => { g.revoked = true; g.revokedAt = now(); g.revokedBy = me.id; g.replaced = true; });
            S.grants.push({ id: Repo.uid('g_'), userId: u.id, areaId: aid, level: f.level.value, type, expiresAt, revoked: false, createdAt: now(), createdBy: me.id });
          }
          if (areas.length) log('permiso', `Otorgó ${LV_LABEL[f.level.value].toLowerCase()} (${type}) a ${email} en ${areas.map(x => areaById(x).name).join(', ')}`);
          save(); c.close(); render(); toast('Permisos guardados');
        });
      },
    });
  }

  function grantLine(g, inModal = false) {
    const a = areaById(g.areaId); const st = grantStatus(g);
    const stChip = st === 'vigente' ? (g.type === 'temporal' ? `<span class="chip ${g.expiresAt - now() < 864e5 ? 'warn' : 'ok'}">${ic('timer')}${fmtLeft(g.expiresAt - now())}</span>` : `<span class="chip ok">${ic('infinity')}Permanente</span>`)
      : st === 'expirado' ? `<span class="chip danger">${ic('clock')}Expiró ${fmtRel(g.expiresAt)}</span>` : `<span class="chip">${ic('ban')}Revocado</span>`;
    return `<div class="grant"><span class="name">${esc(a?.name || '—')}</span><span class="chip">${ic(LV_ICON[g.level])}${LV_LABEL[g.level]}</span>${stChip}
      ${st !== 'revocado' ? `<button type="button" class="x" ${inModal ? `data-revoke="${g.id}"` : `data-act-revoke="${g.id}"`} title="Revocar acceso" aria-label="Revocar">${ic('x')}</button>` : ''}</div>`;
  }
  function revokeGrant(id) {
    const g = S.grants.find(x => x.id === id); if (!g) return;
    g.revoked = true; g.revokedAt = now(); g.revokedBy = me.id;
    log('permiso', `Revocó el acceso de ${userById(g.userId)?.email} a ${areaById(g.areaId)?.name}`); save();
    toast('Acceso revocado');
  }

  function myAccessModal() {
    const gs = S.grants.filter(g => g.userId === me.id).sort((a, b) => b.createdAt - a.createdAt);
    openModal({
      title: 'Mis accesos', sub: `${esc(me.email)} · ${esc(roleOf().name)}`,
      body: can('allAreas') ? `<p class="muted">Tu perfil tiene acceso total a todas las áreas.</p>` : gs.length ? `<div class="grants">${gs.map(g => grantLine(g, true).replace(/<button[^>]*data-revoke[^>]*>[\s\S]*?<\/button>/, '')).join('')}</div>` : '<p class="muted">No tienes accesos asignados.</p>',
      foot: '<button class="btn btn-primary" data-close>Listo</button>',
    });
  }
  function changePassModal() {
    openModal({
      title: 'Cambiar contraseña', sub: esc(me.email),
      body: `<div class="field"><label>Contraseña actual</label><input class="input" type="password" id="p0" autocomplete="current-password"/></div>
        <div class="field"><label>Nueva contraseña</label><input class="input" type="password" id="p1" autocomplete="new-password"/><div class="hint">Mínimo ${S.settings.minPassword} caracteres</div></div>
        <div class="field"><label>Confirmar nueva contraseña</label><input class="input" type="password" id="p2" autocomplete="new-password"/></div>`,
      foot: `<button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" data-ok>Actualizar</button>`,
      onMount: (c) => c.$('[data-ok]').addEventListener('click', async () => {
        if (!(await Repo.verifyPassword(c.$('#p0').value, me.pass))) return toast('La contraseña actual no coincide', 'err');
        if (c.$('#p1').value.length < S.settings.minPassword) return toast('La nueva contraseña es muy corta', 'err');
        if (c.$('#p1').value !== c.$('#p2').value) return toast('Las contraseñas no coinciden', 'err');
        me.pass = await Repo.hashPassword(c.$('#p1').value); log('usuario', 'Cambió su contraseña'); save(); c.close(); toast('Contraseña actualizada');
      }),
    });
  }

  /* ---------------- Configuración ---------------- */
  const TABS = [
    ['general', 'settings-2', 'General', 'settings'],
    ['docs', 'file-cog', 'Documentos', 'settings'],
    ['security', 'shield', 'Seguridad y descargas', 'settings'],
    ['users', 'users', 'Usuarios y permisos', 'managePerms'],
    ['roles', 'id-card', 'Perfiles', 'settings'],
    ['audit', 'scroll-text', 'Bitácora', 'settings'],
    ['data', 'database', 'Datos', 'settings'],
  ];
  function settingsView() {
    const tabs = TABS.filter(t => can(t[3]));
    if (!tabs.length) { route.view = 'home'; return homeView(); }
    if (!tabs.find(t => t[0] === route.tab)) route.tab = tabs[0][0];
    return `<div class="page-title" style="margin-top:36px"><h1>Configuración</h1></div>
      <p class="page-sub">Ajusta el comportamiento de ${esc(S.settings.appName)}: reglas de documentos, seguridad, perfiles y permisos.</p>
      <div class="settings"><nav class="side-nav">${tabs.map(([k, i, l]) => `<button class="${route.tab === k ? 'on' : ''}" data-tab="${k}">${ic(i)}${l}</button>`).join('')}</nav>
      <div id="panel">${panel(route.tab)}</div></div>`;
  }
  const sw = (key, on) => `<label class="switch"><input type="checkbox" data-set="${key}" ${on ? 'checked' : ''}/><span></span></label>`;
  const srow = (title, desc, ctl) => `<div class="set-row"><div class="txt"><strong>${title}</strong><span>${desc}</span></div><div class="ctl">${ctl}</div></div>`;
  function panel(tab) {
    const st = S.settings;
    if (tab === 'general') return `<div class="panel"><h3>Identidad</h3><p class="muted">Nombre de la herramienta y de la organización.</p>
      ${srow('Nombre de la herramienta', 'Se muestra en la barra superior y el acceso', `<input class="input" data-set="appName" value="${esc(st.appName)}"/>`)}
      ${srow('Organización', 'Nombre de la empresa; se muestra junto al logo', `<input class="input" data-set="orgName" value="${esc(st.orgName)}" placeholder="Ej. Control Interno"/>`)}
      ${srow('Apariencia', 'Tema de la interfaz', `<select class="select" data-set="theme"><option value="auto" ${st.theme === 'auto' ? 'selected' : ''}>Automático</option><option value="light" ${st.theme === 'light' ? 'selected' : ''}>Claro</option><option value="dark" ${st.theme === 'dark' ? 'selected' : ''}>Oscuro</option></select>`)}
      </div>
      <div class="panel" id="domainsPanel"><h3>Dominios de correo permitidos</h3><p class="muted">Solo con estos dominios se pueden crear usuarios y asignar contraseñas; son los únicos que aparecen en el modal de permisos.</p>
        <div class="cat-chips" style="margin-bottom:12px">${st.domains.map(d => { const n = S.users.filter(u => u.email.endsWith('@' + d)).length; return `<span class="chip">@${esc(d)} <span class="tiny">(${n} ${n === 1 ? 'usuario' : 'usuarios'})</span><button class="x" data-dom-del="${esc(d)}" aria-label="Quitar ${esc(d)}">${ic('x')}</button></span>`; }).join('') || '<span class="tiny" style="color:var(--warn)">Aún no hay dominios. Agrega uno para poder crear usuarios.</span>'}</div>
        <div style="display:flex;gap:8px"><div class="input-affix" style="flex:1"><input class="input" id="domAdd" placeholder="empresa.com" style="padding-left:30px;height:38px" autocomplete="off"/><span class="affix" style="left:14px;right:auto">@</span></div>
          <button class="btn btn-secondary btn-sm" style="height:38px" id="domAddBtn">${ic('plus')}Agregar dominio</button></div></div>`;
    if (tab === 'docs') return `<div class="panel"><h3>Nomenclatura</h3><p class="muted">Cómo se extrae automáticamente del nombre del archivo.</p>
      <div class="field"><label>Expresión regular (el primer grupo es la nomenclatura)</label><input class="input mono" data-set="nomenRegex" value="${esc(st.nomenRegex)}"/></div>
      <div class="field"><label>Probar con un nombre de archivo</label><input class="input" id="rxTest" value="SGC-PR-005 Compras y proveedores v2.docx"/><div class="hint" id="rxOut"></div></div></div>
      <div class="panel"><h3>Versiones</h3><p class="muted">Control de versiones al subir y editar.</p>
      ${srow('Versión inicial', 'Número entero desde 1, cuando el archivo no indica versión', intInput(`data-set="versionInicial" value="${esc(st.versionInicial)}"`))}
      ${srow('Incrementar versión al editar', 'Sugiere la siguiente versión entera (1 → 2 → 3) al guardar cambios en línea', sw('autoVersion', st.autoVersion))}
      </div>
      <div class="panel"><h3>Catálogos</h3><p class="muted">Opciones de los desplegables. Se llenan solos al capturar un valor nuevo; aquí puedes agregarlos o quitarlos.</p>
      <div class="field"><span class="label">Tipos de documento por categoría</span>
        ${CATEGORIAS.map(c => `<div class="tipo-group"><div class="tg-head">${catChip(c)}<span class="tiny">${CAT_LEVEL[c]}${c === 'Soporte' ? ' · requieren documento rector' : ''}</span></div>
          <div class="cat-chips">${S.catalogs.tipos.filter(t => t.cat === c).map(t => `<span class="chip">${esc(t.name)} <span class="tiny">(${S.docs.filter(d => d.tipo === t.name).length})</span><button class="x" data-tipo-del="${esc(t.name)}" aria-label="Quitar ${esc(t.name)}">${ic('x')}</button></span>`).join('') || '<span class="tiny">Sin tipos</span>'}</div></div>`).join('')}
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input class="input" id="tipoAddName" placeholder="Nuevo tipo de documento" maxlength="50" style="height:38px;flex:1;min-width:180px"/>
          <select class="select" id="tipoAddCat" style="height:38px;width:auto">${CATEGORIAS.map(c => `<option value="${c}">${CAT_LEVEL[c]} · ${c}</option>`).join('')}</select>
          <button class="btn btn-secondary btn-sm" style="height:38px" id="tipoAddBtn">${ic('plus')}Agregar</button></div></div>
      ${['clasificaciones'].map(k => `<div class="field"><span class="label">${CAT_LABEL[k]}</span>
        <div class="cat-chips">${S.catalogs[k].map(v => `<span class="chip">${esc(v)} <span class="tiny">(${S.docs.filter(d => d.clasificacion === v).length})</span><button class="x" data-cat-del="${k}|${esc(v)}" aria-label="Quitar ${esc(v)}">${ic('x')}</button></span>`).join('') || '<span class="tiny">Aún no hay valores</span>'}</div>
        <div style="display:flex;gap:8px;margin-top:10px"><input class="input" data-cat-add="${k}" placeholder="Agregar ${CAT_LABEL[k].toLowerCase()}" maxlength="50" style="height:38px"/><button class="btn btn-secondary btn-sm" style="height:38px" data-cat-add-btn="${k}">${ic('plus')}Agregar</button></div></div>`).join('')}
      </div>
      <div class="panel"><h3>Archivos</h3><p class="muted">Restricciones de carga.</p>
      ${srow('Tamaño máximo por archivo', 'En megabytes', `<input class="input" type="number" min="1" max="200" data-set="maxMB" value="${st.maxMB}"/>`)}
      ${srow('Extensiones permitidas', 'Separadas por coma', `<input class="input mono" data-set="allowedExt" value="${esc(st.allowedExt)}"/>`)}
      </div>`;
    if (tab === 'security') return `<div class="panel"><h3>Descargas</h3><p class="muted">Qué reciben los usuarios con permiso de descarga.</p>
      ${srow('Formato para el nivel “Descargar”', 'Los editores siempre pueden obtener el original', `<select class="select" data-set="downloadFormat"><option value="pdf" ${st.downloadFormat === 'pdf' ? 'selected' : ''}>Solo PDF</option><option value="original" ${st.downloadFormat === 'original' ? 'selected' : ''}>PDF u original</option></select>`)}
      ${srow('Marca de agua', 'Correo y fecha del usuario en vista y PDF (excepto editores)', sw('watermark', st.watermark))}
      ${srow('Bloquear impresión y copiado', 'Para usuarios con nivel “Ver”', sw('blockPrint', st.blockPrint))}
      </div>
      <div class="panel"><h3>Accesos temporales</h3><p class="muted">Comportamiento al vencer un permiso.</p>
      ${srow('Al expirar el acceso', 'Qué ocurre con el área y sus documentos', `<select class="select" data-set="expiredBehavior"><option value="bloquear" ${st.expiredBehavior === 'bloquear' ? 'selected' : ''}>Bloquear por completo</option><option value="ver" ${st.expiredBehavior === 'ver' ? 'selected' : ''}>Degradar a solo ver</option></select>`)}
      ${srow('Mostrar áreas expiradas', 'Se muestran bloqueadas en el inicio', sw('showLockedAreas', st.showLockedAreas))}
      ${srow('Vigencia temporal por defecto', 'En horas, al asignar permisos', `<input class="input" type="number" min="1" data-set="defaultTempHours" value="${st.defaultTempHours}"/>`)}
      ${srow('Longitud mínima de contraseña', 'Para cuentas nuevas y cambios', `<input class="input" type="number" min="6" max="32" data-set="minPassword" value="${st.minPassword}"/>`)}
      </div>`;
    if (tab === 'users') {
      const users = [...S.users].sort((a, b) => a.email.localeCompare(b.email));
      return `<div class="panel"><div style="display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap"><div><h3>Usuarios y permisos</h3><p class="muted" style="margin-bottom:0">${users.length} cuentas · permisos por área, nivel y vigencia.</p></div>
        <button class="btn btn-primary" data-grant-new>${ic('user-plus')}Asignar permisos</button></div>
        <div class="bulk-bar" id="bulkBar"><span id="bulkCount">0 seleccionados</span><span class="nav-spacer"></span>
          <button class="btn btn-secondary btn-sm" data-bulk="revoke">${ic('ban')}Revocar accesos</button>
          <button class="btn btn-secondary btn-sm" data-bulk="deactivate">${ic('user-x')}Desactivar</button>
          <button class="btn btn-secondary btn-sm" data-bulk="activate">${ic('user-check')}Activar</button>
          <button class="btn btn-danger btn-sm" data-bulk="delete">${ic('trash-2')}Eliminar</button></div>
        <div class="table-wrap" style="margin-top:18px"><table class="tbl"><thead><tr><th style="width:44px"><input type="checkbox" class="ck" id="ckAll" aria-label="Seleccionar todos"/></th><th>Usuario</th><th>Perfil</th><th>Accesos por área</th><th>Estado</th><th></th></tr></thead><tbody>
        ${users.map(u => {
          const gs = S.grants.filter(g => g.userId === u.id && !(g.revoked && g.replaced)).sort((a, b) => grantStatus(a).localeCompare(grantStatus(b)) * -1);
          return `<tr><td><input type="checkbox" class="ck" data-ck="${u.id}" aria-label="Seleccionar ${esc(u.email)}"/></td><td><div class="u"><span class="avatar">${initials(u.name)}</span><div><strong>${esc(u.name)}</strong><span class="tiny">${esc(u.email)}${u.id === me.id ? ' · tú' : ''}</span></div></div></td>
            <td><span class="chip ${roleOf(u).caps.allAreas ? 'accent' : ''}">${esc(roleOf(u).name)}</span></td>
            <td><div class="grants">${roleOf(u).caps.allAreas ? '<span class="tiny">Acceso total por perfil</span>' : gs.length ? gs.map(g => grantLine(g)).join('') : '<span class="tiny">Sin accesos</span>'}</div></td>
            <td>${u.active ? '<span class="chip ok">Activo</span>' : '<span class="chip danger">Inactivo</span>'}<div class="tiny" style="margin-top:4px">${u.lastLogin ? 'Último acceso ' + fmtRel(u.lastLogin) : 'Nunca ha iniciado sesión'}</div></td>
            <td><button class="icon-btn" data-user-menu="${u.id}" aria-label="Opciones">${ic('ellipsis')}</button></td></tr>`;
        }).join('')}</tbody></table></div></div>`;
    }
    if (tab === 'roles') return `<div class="panel"><div style="display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap"><div><h3>Perfiles</h3><p class="muted" style="margin-bottom:0">Define qué puede hacer cada perfil. Crear áreas y carpetas desde la página depende de estos ajustes.</p></div>
      <button class="btn btn-secondary" data-new-role>${ic('plus')}Nuevo perfil</button></div>
      <div class="table-wrap" style="margin-top:18px"><table class="tbl matrix"><thead><tr><th>Capacidad</th>${S.roles.map(r => `<th><button class="btn-ghost btn btn-sm" data-edit-role="${r.id}">${esc(r.name)}</button></th>`).join('')}</tr></thead><tbody>
      ${Repo.CAPS.map(cp => `<tr><td>${cp.label}</td>${S.roles.map(r => `<td><label class="switch"><input type="checkbox" data-cap="${r.id}|${cp.key}" ${r.caps[cp.key] ? 'checked' : ''}/><span></span></label></td>`).join('')}</tr>`).join('')}
      <tr><td class="tiny">Usuarios</td>${S.roles.map(r => `<td class="tiny">${S.users.filter(u => u.role === r.id).length}</td>`).join('')}</tr>
      </tbody></table></div><p class="tiny" style="margin-top:14px">Todos los perfiles son editables, incluido Administrador. Para evitar quedarte fuera, siempre debe existir al menos un usuario activo con “Asignar permisos” y “Acceder a configuración”.</p></div>`;
    if (tab === 'audit') return `<div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h3>Bitácora</h3><p class="muted">Últimos ${S.audit.length} movimientos.</p></div>
      <select class="select" id="auditF" style="width:200px;height:38px"><option value="">Todas las acciones</option>${[...new Set(S.audit.map(a => a.action))].map(a => `<option>${esc(a)}</option>`).join('')}</select></div>
      <div id="auditList">${auditList('')}</div></div>`;
    if (tab === 'data') return `<div class="panel"><h3>Almacenamiento</h3><p class="muted">Hoy los datos viven en este navegador. La capa de datos está aislada para conectarse a Supabase sin cambiar la interfaz.</p>
      ${!window.STORAGE_PERSISTENT ? `<div class="hint" style="font-size:13px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);border-radius:12px;margin-bottom:8px">Este navegador bloquea localStorage en esta vista; los datos viven en memoria y se reinician al recargar. Abre la app directamente para que persistan.</div>` : ''}
      ${srow('Metadatos', 'Áreas, carpetas, usuarios, permisos y bitácora en localStorage', `<span class="chip">${fmtSize(new Blob([LocalStore.getItem('acervo.db.v2') || '']).size)}</span>`)}
      ${srow('Archivos', 'Binarios y versiones en IndexedDB del navegador', `<span class="chip">${S.docs.length} documentos</span>`)}
      ${srow('Exportar configuración', 'Respaldo JSON de metadatos. Las contraseñas solo van como hash con sal, nunca en claro', `<button class="btn btn-secondary btn-sm" data-export>${ic('download')}Exportar</button>`)}
      ${srow('Importar respaldo', 'Reemplaza los metadatos actuales', `<button class="btn btn-secondary btn-sm" data-import>${ic('upload')}Importar</button><input type="file" id="impF" accept=".json" hidden/>`)}
      ${srow('Borrar todo y reiniciar', 'Elimina datos, usuarios y contraseñas; vuelve a la configuración inicial', `<button class="btn btn-danger btn-sm" data-reset>${ic('rotate-ccw')}Reiniciar</button>`)}
      </div>`;
    return '';
  }
  const AUDIT_IC = { acceso: 'log-in', área: 'layout-grid', carpeta: 'folder', documento: 'file-text', edición: 'pencil-line', descarga: 'download', consulta: 'eye', permiso: 'key-round', usuario: 'user', sistema: 'cpu', configuración: 'settings' };
  function auditList(f) {
    const rows = S.audit.filter(a => !f || a.action === f).slice(0, 150);
    return rows.length ? rows.map(a => `<div class="audit-row"><span class="ai">${ic(AUDIT_IC[a.action] || 'dot')}</span><div style="flex:1"><div>${esc(a.text)}</div><span class="tiny">${esc(userName(a.by))} · ${fmtDateTime(a.at)}</span></div><span class="chip">${esc(a.action)}</span></div>`).join('') : '<p class="muted">Sin movimientos.</p>';
  }

  function bindSettings() {
    $$('[data-tab]').forEach(b => b.addEventListener('click', () => { route.tab = b.dataset.tab; render(); }));
    const P = $('#panel');
    let saveT;
    $$('[data-set]', P).forEach(el => el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', () => {
      const k = el.dataset.set;
      let v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Math.max(+el.min || 0, +el.value || 0) : el.value;
      if (k === 'versionInicial') { if (!validInt(v)) return; v = intVersion(v); }
      S.settings[k] = v;
      clearTimeout(saveT);
      saveT = setTimeout(() => { save(); log('configuración', `Cambió “${k}”`); save(); toast('Configuración guardada'); if (k === 'theme') { applyTheme(); render(); } if (['appName', 'orgName'].includes(k)) { const a = document.activeElement; render(); const el = $(`[data-set="${k}"]`); if (el && a?.dataset?.set === k) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } } }, 600);
      if (k === 'nomenRegex') rxTest();
    }));
    const rxTest = () => {
      const t = $('#rxTest'); if (!t) return;
      let out;
      try { new RegExp(S.settings.nomenRegex); const p = parseFileName(t.value, null); out = `Nomenclatura: <b class="mono">${esc(p.nomenclatura || '— (se sugerirá con códigos de área y carpeta)')}</b> · Nombre: <b>${esc(p.nombre)}</b>${p.version ? ` · Versión: <b>${esc(p.version)}</b>` : ''}`; }
      catch { out = '<span style="color:var(--danger)">Expresión regular inválida</span>'; }
      $('#rxOut').innerHTML = out;
    };
    $('#rxTest')?.addEventListener('input', rxTest); rxTest();
    $$('[data-cat-del]', P).forEach(b => b.addEventListener('click', () => {
      const [k, v] = b.dataset.catDel.split('|');
      S.catalogs[k] = S.catalogs[k].filter(x => x !== v);
      log('configuración', `Quitó “${v}” de ${CAT_LABEL[k]}`); save(); render(); toast('Opción eliminada del desplegable');
    }));
    $$('[data-cat-add-btn]', P).forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.catAddBtn, inp = $(`[data-cat-add="${k}"]`, P);
      const v = inp.value.trim(); if (!v) return;
      addToCatalog(k, v); log('configuración', `Agregó “${v}” a ${CAT_LABEL[k]}`); save(); render(); toast('Opción agregada');
    }));
    $('#domAddBtn', P)?.addEventListener('click', () => {
      const inp = $('#domAdd', P); const v = inp.value.trim().toLowerCase().replace(/^@/, '');
      if (!DOMAIN_RE.test(v)) { inp.classList.add('invalid'); return toast('Dominio inválido. Ejemplo: empresa.com', 'err'); }
      if (S.settings.domains.includes(v)) return toast('Ese dominio ya está configurado', 'err');
      S.settings.domains.push(v); log('configuración', `Agregó el dominio @${v}`); save(); render(); toast(`Dominio @${v} agregado`);
    });
    $('#domAdd', P)?.addEventListener('keydown', e => { if (e.key === 'Enter') $('#domAddBtn', P).click(); });
    $$('[data-dom-del]', P).forEach(b => b.addEventListener('click', async () => {
      const d = b.dataset.domDel, n = S.users.filter(u => u.email.endsWith('@' + d)).length;
      if (!await confirmDialog({ title: `¿Quitar @${esc(d)}?`, text: n ? `Ya no se podrán crear usuarios con este dominio. Las ${n} cuentas existentes se conservan; puedes revocarlas en Usuarios.` : 'Ya no se podrán crear usuarios con este dominio.', ok: 'Quitar', danger: true })) return;
      S.settings.domains = S.settings.domains.filter(x => x !== d); log('configuración', `Quitó el dominio @${d}`); save(); render(); toast('Dominio quitado');
    }));
    $$('[data-tipo-del]', P).forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.tipoDel, n = S.docs.filter(d => d.tipo === v).length;
      if (n) return toast(`No se puede quitar: ${n} ${n === 1 ? 'documento usa' : 'documentos usan'} este tipo`, 'err');
      S.catalogs.tipos = S.catalogs.tipos.filter(t => t.name !== v);
      log('configuración', `Quitó el tipo “${v}”`); save(); render(); toast('Tipo eliminado');
    }));
    $('#tipoAddBtn', P)?.addEventListener('click', () => {
      const v = $('#tipoAddName', P).value.trim(), c = $('#tipoAddCat', P).value; if (!v) return;
      if (S.catalogs.tipos.some(t => t.name.toLowerCase() === v.toLowerCase())) return toast('Ese tipo ya existe', 'err');
      S.catalogs.tipos.push({ name: v, cat: c }); S.catalogs.tipos.sort((a, b) => a.name.localeCompare(b.name, 'es'));
      log('configuración', `Agregó el tipo “${v}” (${c})`); save(); render(); toast('Tipo agregado');
    });
    $('#tipoAddName', P)?.addEventListener('keydown', e => { if (e.key === 'Enter') $('#tipoAddBtn', P).click(); });
    $$('[data-cat-add]', P).forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') $(`[data-cat-add-btn="${i.dataset.catAdd}"]`, P).click(); }));

    $('[data-grant-new]', P)?.addEventListener('click', () => grantModal());
    $$('[data-act-revoke]', P).forEach(b => b.addEventListener('click', async () => {
      if (!await confirmDialog({ title: '¿Revocar acceso?', text: 'El usuario dejará de ver esta área de inmediato.', ok: 'Revocar', danger: true })) return;
      revokeGrant(b.dataset.actRevoke); render();
    }));
    $$('[data-user-menu]', P).forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      const u = userById(b.dataset.userMenu);
      openMenu(b, [
        { icon: 'key-round', label: 'Editar cuenta y accesos', run: () => grantModal(u) },
        { icon: 'lock-keyhole', label: 'Restablecer contraseña', run: () => resetPass(u) },
        { icon: u.active ? 'user-x' : 'user-check', label: u.active ? 'Desactivar cuenta' : 'Activar cuenta', run: () => bulkUsers([u.id], u.active ? 'deactivate' : 'activate') },
        { icon: 'ban', label: 'Revocar todos sus accesos', run: () => bulkUsers([u.id], 'revoke') },
        '-',
        { icon: 'trash-2', label: 'Eliminar cuenta', danger: true, run: () => bulkUsers([u.id], 'delete') },
      ]);
    }));
    const cks = $$('[data-ck]', P), ckAll = $('#ckAll', P), bar = $('#bulkBar', P);
    const selected = () => cks.filter(c => c.checked).map(c => c.dataset.ck);
    const syncBulk = () => {
      const n = selected().length;
      bar?.classList.toggle('open', n > 0);
      if ($('#bulkCount', P)) $('#bulkCount', P).textContent = n === cks.length && n > 1 ? `Todos (${n}) seleccionados` : `${n} ${n === 1 ? 'seleccionado' : 'seleccionados'}`;
      if (ckAll) { ckAll.checked = n === cks.length && n > 0; ckAll.indeterminate = n > 0 && n < cks.length; }
    };
    cks.forEach(c => c.addEventListener('change', syncBulk));
    ckAll?.addEventListener('change', () => { cks.forEach(c => c.checked = ckAll.checked); syncBulk(); });
    $$('[data-bulk]', P).forEach(b => b.addEventListener('click', () => bulkUsers(selected(), b.dataset.bulk)));
    $$('[data-cap]', P).forEach(el => el.addEventListener('change', () => {
      const [rid, cap] = el.dataset.cap.split('|'); const r = S.roles.find(x => x.id === rid);
      const trial = S.roles.map(x => x.id === rid ? { ...x, caps: { ...x.caps, [cap]: el.checked } } : x);
      if (!keepsAdmin(S.users, trial)) { el.checked = !el.checked; return toast(ADMIN_MSG, 'err'); }
      r.caps[cap] = el.checked; log('configuración', `Perfil ${r.name}: ${cap} ${el.checked ? 'activado' : 'desactivado'}`); save(); toast('Perfil actualizado');
    }));
    $('[data-new-role]', P)?.addEventListener('click', () => roleModal());
    $$('[data-edit-role]', P).forEach(b => b.addEventListener('click', () => roleModal(S.roles.find(r => r.id === b.dataset.editRole))));
    $('#auditF')?.addEventListener('change', (e) => { $('#auditList').innerHTML = auditList(e.target.value); icons(); });
    $('[data-export]', P)?.addEventListener('click', () => saveBlob(new Blob([Repo.export()], { type: 'application/json' }), `filehub-respaldo-${new Date().toISOString().slice(0, 10)}.json`));
    $('[data-import]', P)?.addEventListener('click', () => $('#impF').click());
    $('#impF')?.addEventListener('change', async (e) => {
      try {
        const data = JSON.parse(await e.target.files[0].text());
        if (!data.areas || !data.users || !data.roles) throw new Error('Formato inválido');
        if (!keepsAdmin(data.users, data.roles) || data.users.some(u => !u.pass || typeof u.pass !== 'object')) return toast('El respaldo no tiene un administrador válido o usa un formato de contraseña antiguo', 'err');
        if (!await confirmDialog({ title: '¿Importar respaldo?', text: 'Se reemplazarán los metadatos actuales.', ok: 'Importar' })) return;
        Repo.db = S = data; migrate(); save();
        me = userById(me.id) || null; if (!me) SessionStore.removeItem(SESSION); render(); toast('Respaldo importado');
      } catch (err) { toast('Archivo de respaldo inválido', 'err'); }
    });
    $('[data-reset]', P)?.addEventListener('click', async () => {
      if (!await confirmDialog({ title: '¿Borrar todo y reiniciar?', text: 'Se eliminarán todas las áreas, documentos, usuarios, contraseñas y permisos. Volverás a la configuración inicial.', ok: 'Borrar todo', danger: true })) return;
      await Repo.wipe(); S = null; me = null; SessionStore.removeItem(SESSION); applyTheme(); render();
    });
  }

  /* Acciones sobre uno o varios usuarios */
  async function bulkUsers(ids, action) {
    const sel = S.users.filter(u => ids.includes(u.id));
    if (!sel.length) return toast('Selecciona al menos un usuario', 'info');
    const who = sel.length === 1 ? sel[0].email : `${sel.length} usuarios`;
    const includesMe = sel.some(u => u.id === me.id);
    if (action === 'delete' || action === 'deactivate') {
      const after = action === 'delete' ? S.users.filter(u => !ids.includes(u.id)) : S.users.map(u => ids.includes(u.id) ? { ...u, active: false } : u);
      if (!keepsAdmin(after)) return toast(ADMIN_MSG, 'err');
    }
    const cfg = {
      revoke: { t: '¿Revocar todos los accesos?', x: `${esc(who)} dejará de ver todas sus áreas de inmediato.`, ok: 'Revocar' },
      deactivate: { t: '¿Desactivar cuentas?', x: `${esc(who)} no podrá iniciar sesión hasta que se reactive.${includesMe ? ' Tu sesión se cerrará.' : ''}`, ok: 'Desactivar' },
      activate: { t: '¿Activar cuentas?', x: `${esc(who)} podrá volver a iniciar sesión.`, ok: 'Activar' },
      delete: { t: '¿Eliminar cuentas?', x: `Se eliminarán ${esc(who)}, sus contraseñas y todos sus permisos. Esta acción no se puede deshacer.${includesMe ? ' Incluye tu propia cuenta: tu sesión se cerrará.' : ''}`, ok: 'Eliminar' },
    }[action];
    if (!await confirmDialog({ title: cfg.t, text: cfg.x, ok: cfg.ok, danger: action !== 'activate' })) return;
    const stamp = { revoked: true, revokedAt: now(), revokedBy: me.id };
    if (action === 'revoke') S.grants.filter(g => ids.includes(g.userId) && !g.revoked).forEach(g => Object.assign(g, stamp));
    if (action === 'deactivate') sel.forEach(u => u.active = false);
    if (action === 'activate') sel.forEach(u => u.active = true);
    if (action === 'delete') { S.users = S.users.filter(u => !ids.includes(u.id)); S.grants = S.grants.filter(g => !ids.includes(g.userId)); }
    const verb = { revoke: 'Revocó todos los accesos de', deactivate: 'Desactivó', activate: 'Activó', delete: 'Eliminó' }[action];
    log(action === 'revoke' ? 'permiso' : 'usuario', `${verb} ${sel.map(u => u.email).join(', ')}`);
    save();
    if (includesMe && (action === 'delete' || action === 'deactivate')) return logout('Tu cuenta fue ' + (action === 'delete' ? 'eliminada' : 'desactivada'));
    render();
    toast({ revoke: 'Accesos revocados', deactivate: 'Cuentas desactivadas', activate: 'Cuentas activadas', delete: sel.length === 1 ? 'Cuenta eliminada' : `${sel.length} cuentas eliminadas` }[action]);
  }

  function resetPass(u) {
    openModal({
      title: 'Restablecer contraseña', sub: esc(u.email),
      body: `<div class="field"><label>Nueva contraseña</label><div class="input-icon"><input class="input mono" id="np" type="text" value="${genPassword()}" autocomplete="off"/><button type="button" class="icon-btn" data-copy aria-label="Copiar">${ic('copy')}</button></div><div class="hint">Compártela de forma segura con el usuario.</div></div>`,
      foot: `<button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" data-ok>Guardar</button>`,
      onMount: (c) => {
        c.$('[data-copy]').addEventListener('click', () => { navigator.clipboard?.writeText(c.$('#np').value); toast('Copiada al portapapeles'); });
        c.$('[data-ok]').addEventListener('click', async () => {
          const v = c.$('#np').value; if (v.length < S.settings.minPassword) return toast('Contraseña muy corta', 'err');
          u.pass = await Repo.hashPassword(v); log('usuario', `Restableció la contraseña de ${u.email}`); save(); c.close(); toast('Contraseña restablecida');
        });
      },
    });
  }

  function roleModal(r = null) {
    const isNew = !r;
    openModal({
      title: isNew ? 'Nuevo perfil' : 'Editar perfil',
      body: `<div class="field"><label>Nombre</label><input class="input" id="rn" value="${esc(r?.name || '')}" placeholder="Ej. Auditor externo"/></div>
        <div class="field"><label>Descripción</label><input class="input" id="rd" value="${esc(r?.desc || '')}"/></div>
        ${isNew ? `<div class="field"><label>Copiar capacidades de</label><select class="select" id="rc">${S.roles.map(x => `<option value="${x.id}" ${x.id === 'consulta' ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>` : ''}`,
      foot: `${!isNew ? `<button class="btn btn-danger left" data-del>Eliminar</button>` : ''}<button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" data-ok>Guardar</button>`,
      onMount: (c) => {
        c.$('[data-ok]').addEventListener('click', () => {
          const name = c.$('#rn').value.trim(); if (!name) return toast('El nombre es obligatorio', 'err');
          if (isNew) { const base = S.roles.find(x => x.id === c.$('#rc').value); S.roles.push({ id: Repo.uid('r_'), name, desc: c.$('#rd').value.trim(), caps: { ...base.caps, allAreas: false } }); }
          else Object.assign(r, { name, desc: c.$('#rd').value.trim() });
          log('configuración', `${isNew ? 'Creó' : 'Editó'} el perfil ${name}`); save(); c.close(); render(); toast('Perfil guardado');
        });
        c.$('[data-del]')?.addEventListener('click', () => {
          const n = S.users.filter(u => u.role === r.id).length;
          if (n) return toast(`Hay ${n} usuarios con este perfil; reasígnalos primero`, 'err');
          S.roles = S.roles.filter(x => x.id !== r.id); log('configuración', `Eliminó el perfil ${r.name}`); save(); c.close(); render(); toast('Perfil eliminado');
        });
      },
    });
  }

  /* ---------------- Arranque ---------------- */
  const sid = SessionStore.getItem(SESSION);
  if (sid && S) { const u = userById(sid); if (u && u.active) me = u; }
  render();

  // Revalidar accesos temporales cada 30 s
  setInterval(() => {
    if (!me || $('#modals').children.length) return;
    if (['area', 'folder'].includes(route.view)) {
      const y = scrollY; render(); scrollTo(0, y);
    }
  }, 30000);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => (!S || S.settings.theme === 'auto') && (applyTheme(), render()));
})();

</script>
</body>
</html>
