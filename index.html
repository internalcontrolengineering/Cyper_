      <button class="nav-link ${['home', 'area', 'folder', 'search'].includes(route.view) ? 'active' : ''}" data-act="home">Repositorio</button>
      <button class="nav-link ${route.view === 'dashboard' ? 'active' : ''}" data-act="dashboard">Dashboard</button>
      ${settingsOk ? `<button class="nav-link ${route.view === 'settings' ? 'active' : ''}" data-act="settings">Configuración</button>` : ''}
    </nav>`;
  }

  /* ---------------- Inicio ---------------- */
  function homeView() {
    const areas = visibleAreas();
    const accessible = areas.filter(a => areaAccess(a.id).level);
    const accIds = new Set(accessible.map(a => a.id));
    const docs = S.docs.filter(d => accIds.has(d.areaId));
    const soon = S.grants.filter(g => g.userId === me.id && g.type === 'temporal' && grantStatus(g) === 'vigente');
    const hour = new Date().getHours();
    const greet = hour < 12 ? 'Buenos días' : hour < 19 ? 'Buenas tardes' : 'Buenas noches';
    return `
      <section class="hero">
        <div class="eyebrow">${greet}, ${esc(me.name.split(' ')[0])}</div>
        <h1>Todos tus archivos.<br/>En un solo lugar.</h1>
        <p>Documentos organizados por área y departamento, con versiones, permisos y edición en línea.</p>
        <div class="hero-stats">
          <div class="stat"><strong>${accessible.length}</strong><span>Áreas con acceso</span></div>
          <div class="stat"><strong>${S.folders.filter(f => accIds.has(f.areaId)).length}</strong><span>Departamentos</span></div>
          <div class="stat"><strong>${docs.length}</strong><span>Documentos</span></div>
          ${soon.length ? `<div class="stat"><strong style="color:var(--warn)">${soon.length}</strong><span>Accesos temporales</span></div>` : ''}
        </div>
      </section>
      <div class="section-head"><h2>Áreas</h2>
        <div class="actions">${can('createArea') ? `<button class="btn btn-secondary btn-sm" data-act="newArea">${ic('plus')}Nueva área</button>` : ''}</div></div>
      ${areas.length || can('createArea') ? `<div class="grid">
        ${areas.map((a, i) => areaCard(a, i)).join('')}
        ${can('createArea') ? `<button class="add-card" data-act="newArea" style="animation-delay:${areas.length * 60}ms"><span class="plus">${ic('plus')}</span>Crear área</button>` : ''}
      </div>` : emptyState('lock', 'Aún no tienes áreas asignadas', 'Solicita a un administrador que te otorgue permisos de acceso.')}
`;
  }

  /* ---------------- Pestaña Dashboard ---------------- */
  function dashboardView() {
    const accIds = new Set(S.areas.filter(a => areaAccess(a.id).level).map(a => a.id));
    const docs = S.docs.filter(d => accIds.has(d.areaId));
    const recent = [...docs].sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 8);
    return `<section class="hero hero-sm"><div class="eyebrow">Dashboard</div><h1>Actividad del repositorio.</h1>
        <p>Lo más reciente y los indicadores del acervo, solo de las áreas a las que tienes acceso.</p></section>
      ${recent.length ? `<div class="section-head"><div><h2>Actualizados recientemente</h2><p class="tiny" style="margin-top:4px">${ic('info')} Solo informativo. Para consultar un documento entra a Repositorio, en su área y carpeta, donde se validan tus permisos.</p></div></div>
        ${docTable(recent, true)}` : ''}
      ${docs.length ? dashboardShell() : emptyState('chart-no-axes-column', 'Sin información', 'Aún no hay documentos en las áreas a las que tienes acceso.')}`;
  }

  function areaCard(a, i) {
    const acc = areaAccess(a.id);
    const locked = !acc.level;
    const nf = S.folders.filter(f => f.areaId === a.id).length;
    const nd = S.docs.filter(d => d.areaId === a.id).length;
    return `<div class="area-card ${locked ? 'locked' : ''}" style="${cssVars(a.color)};animation-delay:${i * 60}ms" data-act="openArea" data-id="${a.id}" tabindex="0" role="button" aria-label="${esc(a.name)}">
      ${locked ? `<span class="lock-veil">${ic('lock')}${acc.status === 'expirado' ? 'Expirado' : 'Sin acceso'}</span>` : ''}
      ${can('createArea') && !locked ? `<button class="icon-btn more" data-act="areaMenu" data-id="${a.id}" aria-label="Opciones">${ic('ellipsis')}</button>` : ''}
      <div class="glyph">${ic(a.icon)}</div>
      <h3>${esc(a.name)}</h3><div class="code">${esc(a.code)}</div>
      <p>${esc(a.desc || '')}</p>
      <div class="meta"><span>${ic('folder')}${nf} carpetas</span><span>${ic('file-text')}${nd} docs</span></div>
      <div style="margin-top:12px">${accessChip(acc)}</div>
    </div>`;
  }

  function emptyState(icon, title, text, action = '') {
    return `<div class="empty"><div class="e-icon">${ic(icon)}</div><h3>${title}</h3><p>${text}</p>${action ? `<div style="margin-top:18px">${action}</div>` : ''}</div>`;
  }

  /* ---------------- Área ---------------- */
  function areaView() {
    const a = areaById(route.areaId);
    if (!a) { route.view = 'home'; return homeView(); }
    const acc = areaAccess(a.id);
    if (!acc.level) return crumbs([{ label: a.name }]) + emptyState('lock', 'Acceso no disponible', acc.status === 'expirado' ? `Tu acceso temporal venció el ${fmtDateTime(acc.grant.expiresAt)}.` : 'No tienes permisos en esta área.');
    const folders = S.folders.filter(f => f.areaId === a.id).sort((x, y) => (x.order ?? 0) - (y.order ?? 0));
    const docs = S.docs.filter(d => d.areaId === a.id).sort((x, y) => y.updatedAt - x.updatedAt).slice(0, 5);
    const canF = canFolderIn(a.id);
    return `${crumbs([{ label: a.name }])}
      <div class="page-title" style="${cssVars(a.color)}"><div class="glyph" style="background:linear-gradient(135deg,var(--c1),var(--c2))">${ic(a.icon)}</div>
        <div><h1>${esc(a.name)}</h1></div></div>
      <p class="page-sub">${esc(a.desc || '')}</p>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">${accessChip(acc)}<span class="chip">${ic('hash')}${esc(a.code)}</span></div>
      <div class="section-head"><h2>Departamentos</h2>
        <div class="actions">${canF ? `<button class="btn btn-secondary btn-sm" data-act="newFolder">${ic('folder-plus')}Nueva carpeta</button>` : ''}
        ${can('managePerms') ? `<button class="btn btn-ghost btn-sm" data-act="grant" data-area="${a.id}">${ic('user-plus')}Compartir área</button>` : ''}</div></div>
      ${folders.length || canF ? `<div class="folders" style="${cssVars(a.color)}">
        ${folders.map((f, i) => {
          const n = S.docs.filter(d => d.folderId === f.id).length;
          return `<div class="folder" data-act="openFolder" data-id="${f.id}" style="animation-delay:${i * 50}ms" tabindex="0" role="button">
            ${canF ? `<button class="icon-btn more" data-act="folderMenu" data-id="${f.id}" aria-label="Opciones">${ic('ellipsis')}</button>` : ''}
            <div class="folder-icon"><div class="back"></div><div class="front"></div></div>
            <h4>${esc(f.name)}</h4><span class="tiny">${esc(a.code)}-${esc(f.code)} · ${n} ${n === 1 ? 'documento' : 'documentos'}</span></div>`;
        }).join('')}
        ${canF ? `<button class="add-card add-folder" data-act="newFolder"><span class="plus">${ic('plus')}</span>Crear carpeta</button>` : ''}
      </div>` : emptyState('folder', 'Sin departamentos', 'Esta área aún no tiene carpetas.')}
      ${docs.length ? `<div class="section-head"><h2>Recientes en ${esc(a.name)}</h2></div>${docTable(docs)}` : ''}`;
  }

  function crumbs(items) {
    return `<nav class="crumbs" aria-label="Ruta"><button data-act="home">Repositorio</button>${items.map(it => `${ic('chevron-right')}${it.act ? `<button data-act="${it.act}" data-id="${it.id}">${esc(it.label)}</button>` : `<span>${esc(it.label)}</span>`}`).join('')}</nav>`;
  }

  /* ---------------- Carpeta ---------------- */
  function folderView() {
    const f = folderById(route.folderId); const a = f && areaById(f.areaId);
    if (!f || !a) { route.view = 'home'; return homeView(); }
    const acc = areaAccess(a.id);
    if (!acc.level) { route.areaId = a.id; return areaView(); }
    let docs = S.docs.filter(d => d.folderId === f.id);
    if (ui.filter) { const q = ui.filter.toLowerCase(); docs = docs.filter(d => (d.nomenclatura + ' ' + d.nombre + ' ' + d.fileName + ' ' + d.tipo + ' ' + d.clasificacion).toLowerCase().includes(q)); }
    const sorters = { recent: (x, y) => y.updatedAt - x.updatedAt, code: (x, y) => x.nomenclatura.localeCompare(y.nomenclatura, 'es', { numeric: true }), name: (x, y) => x.nombre.localeCompare(y.nombre, 'es') };
    docs.sort(sorters[ui.sort]);
    const up = canUploadIn(a.id);
    return `${crumbs([{ label: a.name, act: 'openArea', id: a.id }, { label: f.name }])}
      <div class="page-title" style="${cssVars(a.color)}">
        <div class="folder-icon" style="width:64px;height:52px;margin:0"><div class="back"></div><div class="front" style="height:40px"></div></div>
        <div><h1>${esc(f.name)}</h1></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${accessChip(acc)}<span class="chip">${ic('hash')}${esc(a.code)}-${esc(f.code)}</span></div>
      <div class="toolbar-row">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <div class="seg" role="tablist"><button class="${ui.docView === 'list' ? 'on' : ''}" data-act="docView" data-v="list">${ic('list')}Lista</button><button class="${ui.docView === 'grid' ? 'on' : ''}" data-act="docView" data-v="grid">${ic('layout-grid')}Cuadrícula</button></div>
          <select class="select" id="sortSel" style="height:36px;width:auto;border-radius:980px;font-size:13px">
            <option value="recent" ${ui.sort === 'recent' ? 'selected' : ''}>Más recientes</option>
            <option value="code" ${ui.sort === 'code' ? 'selected' : ''}>Por nomenclatura</option>
            <option value="name" ${ui.sort === 'name' ? 'selected' : ''}>Por nombre</option></select>
          <label class="search" style="width:220px">${ic('filter')}<input id="docFilter" placeholder="Filtrar en carpeta" value="${esc(ui.filter)}" /></label>
        </div>
        ${up ? `<button class="btn btn-primary" data-act="pick">${ic('upload')}Subir documentos</button>` : ''}
      </div>
      ${up ? `<div class="dropzone" id="dz"><div class="dz-icon">${ic('cloud-upload')}</div><strong>Arrastra uno o varios archivos aquí</strong>
        <span>o <button class="btn-ghost" style="font-weight:500" data-act="pick">selecciónalos de tu equipo</button> · máx. ${S.settings.maxMB} MB por archivo</span>
        <input type="file" id="fileInput" multiple hidden accept="${S.settings.allowedExt.split(',').map(e => '.' + e.trim()).join(',')}" /></div>` : ''}
      ${docs.length ? (ui.docView === 'list'
        ? docTable(treeOrder(docs))
        : `<div class="doc-grid">${treeOrder(docs).map((it, i) => docTile(it, i)).join('')}</div>`)
        : emptyState('file-text', ui.filter ? 'Sin resultados' : 'Carpeta vacía', ui.filter ? 'Ningún documento coincide con el filtro.' : up ? 'Sube el primer documento de este departamento.' : 'Aún no hay documentos en esta carpeta.')}`;
  }

  const badge = (ext) => `<div class="file-badge" style="background:${EXT_COLOR[ext] || '#8e8e93'}">${esc((ext || 'doc').toUpperCase().slice(0, 4))}</div>`;
  const fmtDocDate = (d) => fmtDate(new Date(d.fechaActualizacion + 'T12:00').getTime());
  const docHeader = () => `<div class="doc-row head"><span></span><span>Documento</span><span>Nomenclatura</span><span>Nombre</span><span>Tipo de documento</span><span>Categoría</span><span>Clasificación</span><span>Versión</span><span>Fecha de última actualización</span><span>Subido por</span><span></span></div>`;
  // rows: documentos o elementos de árbol {d, depth, ref, hit}
  const docTable = (rows, info = false) => `<div class="doc-list ${info ? 'info' : ''}"><div class="doc-scroll">${docHeader()}${rows.map(r => r.d ? docRow(r.d, info, r) : docRow(r, info)).join('')}</div></div>`;

  /* Ordena una lista colocando cada documento de Soporte debajo de su documento rector.
     Si el rector está fuera de la lista (otra carpeta o filtrado), se inserta como fila de referencia. */
  function treeOrder(list, { refs = true, hits = null } = {}) {
    const ids = new Set(list.map(d => d.id));
    const out = [], used = new Set();
    const mark = (d) => hits ? hits.has(d.id) : false;
    for (const d of list) {
      if (used.has(d.id) || (d.rectorId && S.docs.some(x => x.id === d.rectorId))) continue;
      out.push({ d, depth: 0, hit: mark(d) }); used.add(d.id);
      list.filter(k => k.rectorId === d.id).forEach(k => { out.push({ d: k, depth: 1, hit: mark(k) }); used.add(k.id); });
    }
    const groups = new Map();
    list.filter(d => !used.has(d.id)).forEach(d => { if (!groups.has(d.rectorId)) groups.set(d.rectorId, []); groups.get(d.rectorId).push(d); });
    for (const [rid, kids] of groups) {
      const r = docById(rid);
      const showRef = refs && r && !ids.has(rid) && areaAccess(r.areaId).level;
      if (showRef) out.push({ d: r, depth: 0, ref: true });
      kids.forEach(k => out.push({ d: k, depth: showRef ? 1 : 0, hit: mark(k), orphan: !showRef }));
    }
    return out;
  }
  const docById = (id) => S.docs.find(d => d.id === id);

  function docRow(d, info = false, t = {}) {
    const f = folderById(d.folderId), a = areaById(d.areaId);
    const r = d.rectorId ? docById(d.rectorId) : null;
    const nk = childrenOf(d.id).length;
    const sub = info ? `${esc(a?.name || '')} / ${esc(f?.name || '')}`
      : t.ref ? `Documento rector · ${esc(a?.name || '')} / ${esc(f?.name || '')}`
      : (t.orphan || (t.depth && r && r.folderId !== d.folderId)) && r ? `Rector: ${esc(r.nomenclatura)}${r.folderId !== d.folderId ? ` · ${esc(folderById(r.folderId)?.name || '')}` : ''}`
      : (!t.depth && nk && !info) ? `${nk} ${nk === 1 ? 'documento asociado' : 'documentos asociados'}`
      : esc(d.fileName);
    const cls = ['doc-row', info ? 'info' : '', t.depth ? 'child' : '', t.ref ? 'ref' : '', t.hit ? 'hit' : ''].filter(Boolean).join(' ');
    return `<div class="${cls}" ${info ? '' : `data-act="openDoc" data-id="${d.id}" tabindex="0" role="button"`}>
      ${badge(d.ext)}
      <div class="doc-name">${t.depth ? `<i class="tree-mark">${ic('corner-down-right')}</i>` : ''}<div><strong>${esc(d.nomenclatura)} ${esc(d.nombre)}</strong><span>${sub}</span></div></div>
      <span class="mono">${esc(d.nomenclatura)}</span>
      <span class="cell-clip">${esc(d.nombre)}</span>
      <span>${d.tipo ? `<span class="chip">${esc(d.tipo)}</span>` : '<span class="tiny">—</span>'}</span>
      <span>${catChip(d.categoria)}</span>
      <span>${d.clasificacion ? `<span class="chip ${clasifClass(d.clasificacion)}">${esc(d.clasificacion)}</span>` : '<span class="tiny">—</span>'}</span>
      <span><span class="chip ver">${esc(d.version)}</span></span>
      <span class="tiny">${fmtDocDate(d)}</span>
      <span class="tiny cell-clip">${esc(userName(d.subidoPor))}</span>
      ${info ? `<span class="tiny" title="Solo informativo">${ic('eye-off')}</span>` : t.ref ? `<span class="tiny" title="Documento rector en otra carpeta">${ic('link')}</span>` : `<button class="icon-btn" data-act="docMenu" data-id="${d.id}" aria-label="Opciones">${ic('ellipsis')}</button>`}
    </div>`;
  }
  const clasifClass = (c) => /confiden|restring|secret|reserv/i.test(c) ? 'danger' : /p[uú]blic/i.test(c) ? 'ok' : 'accent';
  function docTile(it, i) {
    const d = it.d || it, r = d.rectorId ? docById(d.rectorId) : null;
    return `<div class="doc-tile ${it.depth ? 'child' : ''} ${it.ref ? 'ref' : ''}" data-act="openDoc" data-id="${d.id}" style="animation-delay:${i * 40}ms" tabindex="0" role="button">
      ${badge(d.ext)}<span class="mono tiny">${esc(d.nomenclatura)}</span><strong>${esc(d.nombre)}</strong>
      <span class="tiny">${d.tipo ? esc(d.tipo) + ' · ' : ''}Versión ${esc(d.version)} · ${fmtDocDate(d)}</span>
      ${it.ref ? '<span class="tiny tile-rel">Documento rector · otra carpeta</span>' : r ? `<span class="tiny tile-rel">${ic('corner-down-right')}Rector: ${esc(r.nomenclatura)}</span>` : ''}</div>`;
  }

  /* ---------------- Dashboard ---------------- */
  ui.dash = { area: '', year: '', cat: '', tipo: '' };
  const charts = [];
  const PALETTE = ['#0a84ff', '#30d158', '#ff9f0a', '#bf5af2', '#ff375f', '#64d2ff', '#ffd60a', '#5e5ce6', '#ac8e68', '#00c7be', '#8e8e93'];
  const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  const yearOf = (d) => String(d.fechaActualizacion || '').slice(0, 4);
  const countBy = (arr, fn) => { const m = new Map(); arr.forEach(x => { const k = fn(x); m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); };

  function dashboardShell() {
    return `<section id="dash" class="dash">
      <div class="section-head"><div><h2>Panel de información</h2><p class="tiny" style="margin-top:4px">Calculado sobre las áreas a las que tienes acceso. Los filtros se encadenan: Área → Año → Categoría → Tipo de documento.</p></div>
        <div class="dash-filters">
          <label class="dsel"><span>Área</span><select class="select" id="dfArea"></select></label>
          <label class="dsel"><span>Año</span><select class="select" id="dfYear"></select></label>
          <label class="dsel"><span>Categoría</span><select class="select" id="dfCat"></select></label>
          <label class="dsel"><span>Tipo de documento</span><select class="select" id="dfTipo"></select></label>
          <button class="btn btn-ghost btn-sm" id="dfClear">${ic('rotate-ccw')}Limpiar</button>
        </div></div>
      <div class="kpis" id="dKpis"></div>
      <div class="charts">
        <div class="chart-card span2"><div class="ch-head"><h4 id="tMes">Actualizaciones por mes</h4></div><div class="ch-box"><canvas id="cMes"></canvas></div></div>
        <div class="chart-card"><div class="ch-head"><h4 id="tArea">Documentos por área</h4></div><div class="ch-box"><canvas id="cArea"></canvas></div></div>
        <div class="chart-card"><div class="ch-head"><h4>Por categoría</h4></div><div class="ch-box"><canvas id="cCat"></canvas></div></div>
        <div class="chart-card"><div class="ch-head"><h4>Por tipo de documento</h4></div><div class="ch-box"><canvas id="cTipo"></canvas></div></div>
        <div class="chart-card"><div class="ch-head"><h4>Por clasificación</h4></div><div class="ch-box"><canvas id="cClas"></canvas></div></div>
        <div class="chart-card span2"><div class="ch-head"><h4>Documentos por versión</h4></div><div class="ch-box"><canvas id="cVer"></canvas></div></div>
      </div>
    </section>`;
  }

  function bindDashboard() {
    const order = ['area', 'year', 'cat', 'tipo'];
    ['dfArea', 'dfYear', 'dfCat', 'dfTipo'].forEach((id, i) => $('#' + id).addEventListener('change', (e) => {
      ui.dash[order[i]] = e.target.value;
      // Cascada: al cambiar un nivel se reinician los inferiores
      order.slice(i + 1).forEach(k => ui.dash[k] = '');
      updateDashboard();
    }));
    $('#dfClear').addEventListener('click', () => { ui.dash = { area: '', year: '', cat: '', tipo: '' }; updateDashboard(); });
    updateDashboard();
  }

  function updateDashboard() {
    if (!window.Chart || !$('#dash')) return;
    const accIds = new Set(S.areas.filter(a => areaAccess(a.id).level).map(a => a.id));
    const all = S.docs.filter(d => accIds.has(d.areaId));
    const f = ui.dash;
    // Nivel 1: área
    const areaOpts = S.areas.filter(a => accIds.has(a.id) && all.some(d => d.areaId === a.id));
    if (f.area && !areaOpts.some(a => a.id === f.area)) f.area = '';
    const lvl1 = all.filter(d => !f.area || d.areaId === f.area);
    // Nivel 2: año (solo años con documentos del área elegida)
    const years = [...new Set(lvl1.map(yearOf).filter(Boolean))].sort((a, b) => b - a);
    if (f.year && !years.includes(f.year)) f.year = '';
    const lvl2 = lvl1.filter(d => !f.year || yearOf(d) === f.year);
    // Nivel 3: categoría
    const catOf = (d) => d.categoria || 'Sin categoría';
    const cats = [...CATEGORIAS, 'Sin categoría'].filter(c => lvl2.some(d => catOf(d) === c));
    if (f.cat && !cats.includes(f.cat)) f.cat = '';
    const lvl3 = lvl2.filter(d => !f.cat || catOf(d) === f.cat);
    // Nivel 4: tipo (solo tipos presentes en área + año + categoría)
    const tipos = [...new Set(lvl3.map(d => d.tipo || 'Sin tipo'))].sort((a, b) => a.localeCompare(b, 'es'));
    if (f.tipo && !tipos.includes(f.tipo)) f.tipo = '';
    const data = lvl3.filter(d => !f.tipo || (d.tipo || 'Sin tipo') === f.tipo);

    const opt = (v, l, sel) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(l)}</option>`;
    $('#dfArea').innerHTML = opt('', 'Todas las áreas', f.area) + areaOpts.map(a => opt(a.id, `${a.name} (${all.filter(d => d.areaId === a.id).length})`, f.area)).join('');
    $('#dfYear').innerHTML = opt('', 'Todos los años', f.year) + years.map(y => opt(y, `${y} (${lvl1.filter(d => yearOf(d) === y).length})`, f.year)).join('');
    $('#dfCat').innerHTML = opt('', 'Todas las categorías', f.cat) + cats.map(c => opt(c, `${c} (${lvl2.filter(d => catOf(d) === c).length})`, f.cat)).join('');
    $('#dfTipo').innerHTML = opt('', 'Todos los tipos', f.tipo) + tipos.map(t => opt(t, `${t} (${lvl3.filter(d => (d.tipo || 'Sin tipo') === t).length})`, f.tipo)).join('');
    $('#dfClear').classList.toggle('hidden', !f.area && !f.year && !f.cat && !f.tipo);

    // KPIs
    const d30 = data.filter(d => now() - new Date(d.fechaActualizacion + 'T12:00').getTime() <= 30 * 864e5).length;
    const multi = data.filter(d => +d.version > 1).length;
    const avg = data.length ? (data.reduce((s, d) => s + (+d.version || 1), 0) / data.length) : 0;
    const kpi = (icon, val, label, sub = '') => `<div class="kpi">${ic(icon)}<strong>${val}</strong><span>${label}</span>${sub ? `<em>${sub}</em>` : ''}</div>`;
    $('#dKpis').innerHTML = [
      kpi('file-text', data.length, 'Documentos', f.area || f.year || f.cat || f.tipo ? `de ${all.length} en total` : ''),
      kpi('layers', new Set(data.map(d => d.tipo || 'Sin tipo')).size, 'Tipos de documento'),
      kpi('calendar-clock', d30, 'Actualizados en 30 días'),
      kpi('git-branch', avg ? avg.toFixed(1) : '0', 'Versión promedio', `${multi} con más de una versión`),
    ].join('');

    // Gráficos
    charts.splice(0).forEach(c => c.destroy());
    const cs = getComputedStyle(document.documentElement);
    const txt = cs.getPropertyValue('--text-2').trim(), grid = cs.getPropertyValue('--line').trim(), bg = cs.getPropertyValue('--bg-elev').trim();
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    Chart.defaults.color = txt;
    const base = { responsive: true, maintainAspectRatio: false, animation: { duration: 700, easing: 'easeOutQuart' }, plugins: { legend: { display: false }, tooltip: { padding: 10, cornerRadius: 10 } } };
    const axes = (horizontal = false) => ({
      x: { grid: { display: horizontal, color: grid }, border: { display: false }, ticks: horizontal ? { precision: 0 } : {} },
      y: { grid: { display: !horizontal, color: grid }, border: { display: false }, beginAtZero: true, ticks: horizontal ? {} : { precision: 0 } },
    });
    const empty = (id) => { const c = $('#' + id); const box = c.parentElement; box.querySelector('.ch-empty')?.remove(); if (!data.length) box.insertAdjacentHTML('beforeend', '<div class="ch-empty">Sin datos para los filtros elegidos</div>'); return !data.length; };
    const mk = (id, cfg) => { if (empty(id)) return; charts.push(new Chart($('#' + id), cfg)); };

    // 1. Por mes del año elegido o por año
    let labels, values;
    if (f.year) { labels = MESES; values = MESES.map((_, i) => data.filter(d => +d.fechaActualizacion.slice(5, 7) === i + 1).length); $('#tMes').textContent = `Actualizaciones por mes · ${f.year}`; }
    else { const ys = [...new Set(data.map(yearOf))].sort(); labels = ys; values = ys.map(y => data.filter(d => yearOf(d) === y).length); $('#tMes').textContent = 'Actualizaciones por año'; }
    mk('cMes', { type: 'bar', data: { labels, datasets: [{ data: values, backgroundColor: cs.getPropertyValue('--accent').trim(), borderRadius: 8, maxBarThickness: 46 }] }, options: { ...base, scales: axes() } });

    // 2. Por área o por departamento
    let rowsA;
    if (f.area) { $('#tArea').textContent = `Documentos por departamento · ${areaById(f.area).name}`; rowsA = countBy(data, d => folderById(d.folderId)?.name || '—'); }
    else { $('#tArea').textContent = 'Documentos por área'; rowsA = countBy(data, d => areaById(d.areaId)?.name || '—'); }
    const aColor = (name) => { const a = S.areas.find(x => x.name === name); return a ? (COLORS[a.color] || COLORS.blue)[0] : (COLORS[areaById(f.area)?.color] || COLORS.blue)[0]; };
    mk('cArea', { type: 'bar', data: { labels: rowsA.map(r => r[0]), datasets: [{ data: rowsA.map(r => r[1]), backgroundColor: rowsA.map(r => aColor(r[0])), borderRadius: 8, maxBarThickness: 28 }] }, options: { ...base, indexAxis: 'y', scales: axes(true) } });

    // 3 y 4. Donas
    const donut = (id, rows) => mk(id, { type: 'doughnut', data: { labels: rows.map(r => r[0]), datasets: [{ data: rows.map(r => r[1]), backgroundColor: rows.map((_, i) => PALETTE[i % PALETTE.length]), borderColor: bg, borderWidth: 3, hoverOffset: 8 }] },
      options: { ...base, cutout: '64%', plugins: { ...base.plugins, legend: { display: true, position: 'right', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, padding: 12 } } } } });
    const cr = [...CATEGORIAS, 'Sin categoría'].map(c => [c, data.filter(d => catOf(d) === c).length]).filter(r => r[1] || CATEGORIAS.includes(r[0]));
    mk('cCat', { type: 'bar', data: { labels: cr.map(r => r[0] === 'Sin categoría' ? r[0] : `${r[0]} · ${CAT_LEVEL[r[0]]}`), datasets: [{ data: cr.map(r => r[1]), backgroundColor: cr.map(r => CAT_COLOR[r[0]] || '#8e8e93'), borderRadius: 8, maxBarThickness: 56 }] }, options: { ...base, scales: axes() } });
    donut('cTipo', countBy(data, d => d.tipo || 'Sin tipo'));
    donut('cClas', countBy(data, d => d.clasificacion || 'Sin clasificación'));

    // 5. Por versión
    const vr = countBy(data, d => +d.version >= 5 ? '5 o más' : String(d.version)).sort((a, b) => (a[0] === '5 o más') - (b[0] === '5 o más') || a[0].localeCompare(b[0], 'es', { numeric: true }));
    mk('cVer', { type: 'bar', data: { labels: vr.map(r => r[0]), datasets: [{ data: vr.map(r => r[1]), backgroundColor: '#bf5af2', borderRadius: 8, maxBarThickness: 46 }] }, options: { ...base, scales: axes() } });
    icons();
  }

  /* ---------------- Búsqueda ---------------- */
  function searchView() {
    const q = route.q.trim().toLowerCase();
    const ok = (d) => d && areaAccess(d.areaId).level;
    const res = S.docs.filter(d => ok(d) && (d.nomenclatura + ' ' + d.nombre + ' ' + d.fileName + ' ' + d.tipo + ' ' + (d.categoria || '') + ' ' + d.clasificacion).toLowerCase().includes(q));
    // Cada resultado trae consigo su documento rector y sus documentos asociados
    const hits = new Set(res.map(d => d.id)), all = new Map(res.map(d => [d.id, d]));
    for (const d of res) {
      const r = d.rectorId && docById(d.rectorId);
      if (ok(r)) all.set(r.id, r);
      childrenOf(d.id).filter(ok).forEach(k => all.set(k.id, k));
    }
    const list = [...all.values()].sort((x, y) => x.nomenclatura.localeCompare(y.nomenclatura, 'es', { numeric: true }));
    const rel = list.length - res.length;
    return `${crumbs([{ label: 'Búsqueda' }])}
      <div class="page-title"><h1>“${esc(route.q)}”</h1></div>
      <p class="page-sub">${res.length} ${res.length === 1 ? 'resultado' : 'resultados'}${rel ? ` + ${rel} ${rel === 1 ? 'documento relacionado' : 'documentos relacionados'} (rector o asociados)` : ''} en las áreas a las que tienes acceso</p>
      <div style="margin-top:24px">${res.length ? docTable(treeOrder(list, { refs: false, hits })) : emptyState('search-x', 'Sin coincidencias', 'Prueba con otra nomenclatura o nombre.')}</div>`;
  }

  /* ---------------- Eventos de vistas ---------------- */
  function bindView() {
    const q = $('#q');
    if (q) {
      let t; q.addEventListener('input', () => {
        clearTimeout(t); t = setTimeout(() => {
          const v = q.value.trim();
          if (v.length >= 2) { route.q = v; route.view = 'search'; $('#view').innerHTML = searchView(); icons(); }
          else if (!v && route.view === 'search') go('home');
        }, 220);
      });
      if (route.view === 'search') { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }
    const sort = $('#sortSel'); sort && sort.addEventListener('change', () => { ui.sort = sort.value; render(); });
    const filt = $('#docFilter');
    if (filt) {
      let t; filt.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { ui.filter = filt.value; render(); const n = $('#docFilter'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); });
    }
    const dz = $('#dz');
    if (dz) {
      const fi = $('#fileInput');
      fi.addEventListener('change', () => { startUpload(Array.from(fi.files), folderById(route.folderId)); fi.value = ''; });
      ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('drag'); }));
      ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('drag'); }));
      dz.addEventListener('drop', (e) => startUpload(Array.from(e.dataTransfer.files), folderById(route.folderId)));
    }
    if (route.view === 'settings') bindSettings();
    if (route.view === 'dashboard' && $('#dash')) bindDashboard();
  }

  const ACT = {
    home: () => { ui.filter = ''; go('home'); },
    dashboard: () => go('dashboard'),
    settings: () => go('settings', { tab: can('settings') ? (route.tab || 'general') : 'users' }),
    theme: () => {
      const cur = document.documentElement.dataset.theme;
      S.settings.theme = cur === 'dark' ? 'light' : 'dark'; save(); applyTheme(); render();
    },
    usermenu: (el) => {
      const m = document.createElement('div');
      m.className = 'dropdown';
      m.innerHTML = `<div class="dropdown-head"><strong>${esc(me.name)}</strong><span class="tiny">${esc(me.email)}</span><div style="margin-top:8px"><span class="chip accent">${esc(roleOf().name)}</span></div></div>
        <button class="dropdown-item" data-m="access">${ic('key-round')}Mis accesos</button>
        <button class="dropdown-item" data-m="pass">${ic('lock-keyhole')}Cambiar contraseña</button>
        ${can('settings') || can('managePerms') ? `<button class="dropdown-item" data-m="settings">${ic('settings')}Configuración</button>` : ''}
        <div style="height:1px;background:var(--line);margin:6px 4px"></div>
        <button class="dropdown-item danger" data-m="logout">${ic('log-out')}Cerrar sesión</button>`;
      const wrap = el.parentElement; $$('.dropdown', wrap).forEach(x => x.remove()); wrap.appendChild(m); icons();
      m.addEventListener('click', (e) => {
        const b = e.target.closest('[data-m]'); if (!b) return; m.remove();
        if (b.dataset.m === 'logout') { log('acceso', 'Cierre de sesión'); save(); me = null; SessionStore.removeItem(SESSION); render(); }
        if (b.dataset.m === 'settings') ACT.settings();
        if (b.dataset.m === 'access') myAccessModal();
        if (b.dataset.m === 'pass') changePassModal();
      });
      setTimeout(() => document.addEventListener('click', (e) => { if (!m.contains(e.target)) m.remove(); }, { once: true }), 0);
    },
    grant: (el) => grantModal(null, el.dataset.area ? [el.dataset.area] : []),
    newArea: () => areaModal(),
    openArea: (el) => {
      const acc = areaAccess(el.dataset.id);
      if (!acc.level) return toast(acc.status === 'expirado' ? 'Tu acceso temporal a esta área expiró' : 'No tienes acceso a esta área', 'err');
      ui.filter = ''; go('area', { areaId: el.dataset.id });
    },
    areaMenu: (el) => {
      const a = areaById(el.dataset.id);
      openMenu(el, [
        { icon: 'pencil', label: 'Editar área', run: () => areaModal(a) },
        ...(can('managePerms') ? [{ icon: 'user-plus', label: 'Compartir área', run: () => grantModal(null, [a.id]) }] : []),
        '-',
        { icon: 'trash-2', label: 'Eliminar área', danger: true, run: () => deleteArea(a) },
      ]);
    },
    newFolder: () => folderModal(null, route.areaId),
    openFolder: (el) => { ui.filter = ''; go('folder', { folderId: el.dataset.id }); },
    folderMenu: (el) => {
      const f = folderById(el.dataset.id);
      openMenu(el, [
        { icon: 'pencil', label: 'Renombrar carpeta', run: () => folderModal(f, f.areaId) },
        '-',
        { icon: 'trash-2', label: 'Eliminar carpeta', danger: true, run: () => deleteFolder(f) },
      ]);
    },
    docView: (el) => { ui.docView = el.dataset.v; render(); },
    pick: () => $('#fileInput')?.click(),
    openDoc: (el) => openViewer(S.docs.find(d => d.id === el.dataset.id)),
    docMenu: (el) => {
      const d = S.docs.find(x => x.id === el.dataset.id);
      const lvl = areaAccess(d.areaId).level;
      const items = [{ icon: 'eye', label: 'Abrir', run: () => openViewer(d) }];
      if (LV[lvl] >= 2) items.push({ icon: 'download', label: 'Descargar', run: () => downloadDoc(d) });
      if (lvl === 'editar' && can('upload')) items.push({ icon: 'file-pen', label: 'Editar datos', run: () => metaModal(d) });
      if (lvl === 'editar' && can('upload')) items.push({ icon: 'file-up', label: 'Subir nueva versión', run: () => newVersionUpload(d) });
      if (can('deleteDocs') && lvl === 'editar') items.push('-', { icon: 'trash-2', label: 'Eliminar', danger: true, run: () => deleteDoc(d) });
      openMenu(el, items);
    },
  };

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t || t.closest('.modal-root') || !ACT[t.dataset.act]) return;
    if (t.dataset.act !== 'usermenu') e.stopPropagation();
    ACT[t.dataset.act](t, e);
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
  });
  // Versiones: solo enteros a partir de 1
  document.addEventListener('input', (e) => {
    if (!e.target.matches('[data-int]')) return;
    const v = e.target.value.replace(/\D/g, '').replace(/^0+/, '');
    if (v !== e.target.value) e.target.value = v;
  });
  const validInt = (v) => /^[1-9]\d*$/.test(String(v).trim());
  const intInput = (attrs) => `<input class="input mono" data-int inputmode="numeric" pattern="[1-9][0-9]*" maxlength="4" autocomplete="off" ${attrs}/>`;

  /* Campo dinámico de catálogo: texto libre la primera vez, desplegable cuando ya hay valores */
  const CAT_LABEL = { tipos: 'Tipo de documento', clasificaciones: 'Clasificación' };
  function catalogField(kind, name, value = '') {
    const list = [...S.catalogs[kind]];
    if (value && !list.includes(value)) list.push(value);
    const label = CAT_LABEL[kind];
    if (!list.length) return `<div class="field cat-field" data-kind="${kind}"><label>${label}</label>
      <input class="input" name="${name}" value="${esc(value)}" placeholder="Escribe el primero" maxlength="50" autocomplete="off"/>
      <div class="hint">Se guardará y aparecerá como opción del desplegable</div></div>`;
    return `<div class="field cat-field" data-kind="${kind}"><label>${label}</label>
      <select class="select" name="${name}"><option value="">Selecciona…</option>${list.map(v => `<option ${v === value ? 'selected' : ''}>${esc(v)}</option>`).join('')}<option value="__new__">+ Agregar nuevo…</option></select>
      <input class="input hidden" data-new placeholder="Nuevo ${label.toLowerCase()}" maxlength="50" style="margin-top:8px" autocomplete="off"/></div>`;
  }
  function bindCatalogFields(root) {
    root.querySelectorAll('.cat-field select').forEach(sel => sel.addEventListener('change', () => {
      const inp = sel.parentElement.querySelector('[data-new]');
      inp.classList.toggle('hidden', sel.value !== '__new__'); if (sel.value === '__new__') inp.focus();
    }));
  }
  function readCatalog(root, name) {
    const el = root.querySelector(`[name="${name}"]`);
    if (el.tagName === 'SELECT') return el.value === '__new__' ? el.parentElement.querySelector('[data-new]').value.trim() : el.value;
    return el.value.trim();
  }

  /* Tipo de documento por nivel + Categoría automática + Documento rector (3er nivel) */
  function tipoBlock({ tipo = '', rectorId = null, selfId = null, folder = null, clasificacion = '' } = {}) {
    const cats = CATEGORIAS.map(c => ({ c, items: S.catalogs.tipos.filter(t => t.cat === c) })).filter(g => g.items.length);
    const legacy = tipo && !catOfTipo(tipo) ? `<option value="${esc(tipo)}" selected>${esc(tipo)} (sin categoría)</option>` : '';
    const cat = catOfTipo(tipo);
    return `<div class="tipo-block" data-self="${selfId || ''}" data-folder="${folder ? folder.id : ''}">
      <div class="row-3">
        <div class="field"><label>Tipo de documento</label><select class="select" name="tipo"><option value="">Selecciona…</option>${legacy}
          ${cats.map(g => `<optgroup label="${CAT_LEVEL[g.c]} · ${g.c}">${g.items.map(t => `<option ${t.name === tipo ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</optgroup>`).join('')}</select></div>
        <div class="field"><label>Categoría</label><input class="input" name="categoria" value="${esc(cat)}" readonly placeholder="Se llena con el tipo" tabindex="-1"/><div class="hint" data-cat-hint>${cat ? CAT_LEVEL[cat] : 'Automática'}</div></div>
        ${catalogField('clasificaciones', 'clasificacion', clasificacion)}
      </div>
      <div class="field rector-field ${cat === 'Soporte' ? '' : 'hidden'}"><label>Documento rector <span class="tiny">(obligatorio para 3er nivel)</span></label>
        <select class="select" name="rector">${rectorOptions(rectorId, selfId, folder)}</select>
        <div class="hint">Debe ser un documento de 1er nivel (Estratégico) o 2º nivel (Operativo). En la lista, este documento aparecerá debajo de su rector.</div></div>
    </div>`;
  }
  function rectorOptions(rectorId, selfId, folder) {
    const cand = S.docs.filter(d => d.id !== selfId && isRectorCat(d.categoria) && areaAccess(d.areaId).level);
    if (!cand.length) return '<option value="">No hay documentos de 1er o 2º nivel disponibles</option>';
    const groups = new Map();
    const key = (d) => folder && d.folderId === folder.id ? '0|Esta carpeta' : `1|${areaById(d.areaId)?.name || ''} / ${folderById(d.folderId)?.name || ''}`;
    cand.sort((a, b) => key(a).localeCompare(key(b), 'es') || a.nomenclatura.localeCompare(b.nomenclatura, 'es', { numeric: true }))
      .forEach(d => { const k = key(d); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(d); });
    return '<option value="">Selecciona el documento rector…</option>' + [...groups].map(([k, ds]) => `<optgroup label="${esc(k.slice(2))}">${ds.map(d => `<option value="${d.id}" ${d.id === rectorId ? 'selected' : ''}>${esc(d.nomenclatura)} · ${esc(d.nombre)} (${esc(d.tipo)})</option>`).join('')}</optgroup>`).join('');
  }
  function bindTipoBlock(root) {
    const b = root.querySelector('.tipo-block'); if (!b) return;
    const sel = b.querySelector('[name=tipo]'), catI = b.querySelector('[name=categoria]'), hint = b.querySelector('[data-cat-hint]'), rf = b.querySelector('.rector-field');
    const sync = () => {
      const c = catOfTipo(sel.value);
      catI.value = c; hint.textContent = c ? CAT_LEVEL[c] : 'Automática';
      catI.className = 'input ' + (CAT_CLASS[c] || '');
      rf.classList.toggle('hidden', c !== 'Soporte');
      sel.classList.remove('invalid');
    };
    sel.addEventListener('change', sync); sync();
    b.querySelector('[name=rector]').addEventListener('change', (e) => e.target.classList.remove('invalid'));
  }
  function readTipoBlock(root) {
    const sel = root.querySelector('.tipo-block [name=tipo]');
    const tipo = sel.value, categoria = catOfTipo(tipo);
    if (!tipo) { sel.classList.add('invalid'); return { error: 'Indica el tipo de documento' }; }
    if (!categoria) { sel.classList.add('invalid'); return { error: 'Elige un tipo del catálogo para asignar su categoría' }; }
    let rectorId = null;
    if (categoria === 'Soporte') {
      const rs = root.querySelector('.tipo-block [name=rector]');
      rectorId = rs.value || null;
      if (!rectorId) { rs.classList.add('invalid'); return { error: S.docs.some(d => isRectorCat(d.categoria)) ? 'Un documento de 3er nivel necesita su documento rector' : 'Primero carga un documento de 1er nivel (Estratégico) o 2º nivel (Operativo) que funcione como rector' }; }
    }
    return { tipo, categoria, rectorId };
  }

  /* ---------------- Carga de documentos ---------------- */
  function parseFileName(fileName, folder) {
    const base = fileName.replace(/\.[^.]+$/, '').trim();
    let rest = base, version = '', nomen = '';
    const vm = rest.match(/[\s_\-.(]+v(?:er(?:si[oó]n)?)?[\s.]?(\d+(?:\.\d+)*)\)?\s*$/i) || rest.match(/[\s_\-(]+v(\d+(?:\.\d+)*)\)?(?=[\s_\-]|$)/i);
    if (vm) { version = intVersion(vm[1]); rest = rest.replace(vm[0], ' '); }
    try {
      const m = rest.match(new RegExp(S.settings.nomenRegex));
      if (m) { nomen = (m[1] || m[0]); rest = rest.slice(rest.indexOf(m[0]) + m[0].length); }
    } catch (e) { /* regex inválida en config */ }
    let nombre = rest.replace(/[_]+/g, ' ').replace(/^[\s\-–—_.:]+|[\s\-–—_.:]+$/g, '').replace(/\s{2,}/g, ' ');
    if (!nombre) nombre = base.replace(/[_]+/g, ' ');
    nombre = nombre.charAt(0).toUpperCase() + nombre.slice(1);
    nomen = nomen.toUpperCase().replace(/_/g, '-');
    let suggested = false;
    if (!nomen && folder) {
      const a = areaById(folder.areaId);
      const n = S.docs.filter(d => d.folderId === folder.id).length + 1;
      nomen = `${a.code}-${folder.code}-${String(n).padStart(3, '0')}`; suggested = true;
    }
    return { nomenclatura: nomen, nombre, version, suggested };
  }

  function startUpload(files, folder, replaceDoc = null) {
    if (!files.length || !folder) return;
    if (!canUploadIn(folder.areaId)) return toast('No tienes permiso para subir en esta área', 'err');
    const allowed = S.settings.allowedExt.split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
    const max = S.settings.maxMB * 1048576;
    const ok = [], bad = [];
    for (const f of files) {
      const e = extOf(f.name);
      if (!allowed.includes(e)) bad.push(`${f.name}: formato .${e} no permitido`);
      else if (f.size > max) bad.push(`${f.name}: supera ${S.settings.maxMB} MB`);
      else ok.push(f);
    }
    if (bad.length) toast(bad.length === 1 ? bad[0] : `${bad.length} archivos rechazados por formato o tamaño`, 'err');
    if (!ok.length) return;
    const queue = { files: ok, i: 0, shared: null, done: 0, folder, replaceDoc };
    uploadStep(queue);
  }

  function uploadStep(Q) {

    const tipo = Q.shared?.tipo ?? p.tipo ?? '', clasificacion = Q.shared?.clasificacion ?? p.clasificacion ?? '', rectorId = Q.shared?.rectorId ?? p.rectorId ?? null;

          if (f.applyAll?.checked) Q.shared = { version: meta.version, fecha: meta.fecha, tipo: meta.tipo, rectorId: meta.rectorId, clasificacion: meta.clasificacion }; else Q.shared = null;
          try { await storeUpload(file, meta, Q.folder, Q.replaceDoc); Q.done++; }
          catch (e) { console.error(e); toast('No se pudo procesar ' + file.name, 'err'); }
          c.close(); Q.i++; setTimeout(() => uploadStep(Q), 260);
        });
      },
    });
  }

  async function convertToHtml(file) {
    const ext = extOf(file.name);
    try {
      if (ext === 'docx' && window.mammoth) {
        const r = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
        return r.value || '<p></p>';
      }
      if (['xlsx', 'xls', 'csv'].includes(ext) && window.XLSX) {
        const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
        return wb.SheetNames.map(n => `<h2>${esc(n)}</h2>` + XLSX.utils.sheet_to_html(wb.Sheets[n], { header: '', footer: '' }).replace(/<\/?(html|head|body|meta)[^>]*>/gi, '').replace(/<title>.*?<\/title>/i, '')).join('');
      }
      if (['txt', 'md'].includes(ext)) {
        const t = await file.text();
        return t.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
      }
      if (ext === 'html') {
        const doc = new DOMParser().parseFromString(await file.text(), 'text/html');
        doc.querySelectorAll('script,style,iframe,object').forEach(n => n.remove());
        return doc.body.innerHTML;
      }
    } catch (e) { console.warn('Conversión fallida', e); }
    return null;
  }

  async function storeUpload(file, meta, folder, replaceDoc) {
    const ext = extOf(file.name);
    const html = await convertToHtml(file);
    if (replaceDoc) {
      const d = replaceDoc;
      // Respaldar versión previa
      const prevKey = `hist:${d.id}:${d.history.length}`;
      const prevHtml = await Files.get('html:' + d.id);
      const prevOrig = await Files.get('orig:' + d.id);
      await Files.put(prevKey, { html: prevHtml || null, orig: prevOrig || null, ext: d.ext, fileName: d.fileName });
      d.history[d.history.length - 1].key = prevKey;
      await Files.put('orig:' + d.id, file);
      if (html) await Files.put('html:' + d.id, html); else await Files.del('html:' + d.id);
      Object.assign(d, { version: meta.version, fechaActualizacion: meta.fecha, tipo: meta.tipo, categoria: meta.categoria, rectorId: meta.rectorId, clasificacion: meta.clasificacion, fileName: file.name, ext, mime: file.type, size: file.size, editable: !!html, updatedAt: now(), updatedBy: me.id, subidoPor: me.id });
      d.history.push({ v: meta.version, at: now(), by: me.id, note: meta.nota || 'Nueva versión cargada', key: null });
      log('documento', `Subió la versión ${meta.version} de ${d.nomenclatura}`);
    } else {
      const id = Repo.uid('d_');
      await Files.put('orig:' + id, file);
      if (html) await Files.put('html:' + id, html);
      S.docs.push({
        id, areaId: folder.areaId, folderId: folder.id,
        nomenclatura: meta.nomenclatura, nombre: meta.nombre, version: meta.version, fechaActualizacion: meta.fecha, tipo: meta.tipo, categoria: meta.categoria, rectorId: meta.rectorId, clasificacion: meta.clasificacion,
        subidoPor: me.id, fileName: file.name, ext, mime: file.type, size: file.size, editable: !!html,
        createdAt: now(), updatedAt: now(), updatedBy: me.id,
        history: [{ v: meta.version, at: now(), by: me.id, note: meta.nota || 'Publicación inicial', key: null }],
      });
      log('documento', `Publicó ${meta.nomenclatura} · ${meta.nombre} en ${folder.name}`);
    }
    save();
  }

  function newVersionUpload(d) {
    const inp = document.createElement('input'); inp.type = 'file';
    inp.accept = S.settings.allowedExt.split(',').map(e => '.' + e.trim()).join(',');
    inp.onchange = () => inp.files[0] && startUpload([inp.files[0]], folderById(d.folderId), d);
    inp.click();
  }

  async function purgeDocFiles(d) {
    await Files.del('orig:' + d.id); await Files.del('html:' + d.id);
    for (const h of d.history) if (h.key) await Files.del(h.key);
  }
  async function deleteDoc(d) {
    const kids = childrenOf(d.id);
    if (kids.length) return toast(`No se puede eliminar: es rector de ${kids.length} ${kids.length === 1 ? 'documento asociado' : 'documentos asociados'} (${kids.slice(0, 3).map(k => k.nomenclatura).join(', ')}${kids.length > 3 ? '…' : ''}). Reasígnalos o elimínalos primero.`, 'err');
    if (!await confirmDialog({ title: '¿Eliminar documento?', text: `${esc(d.nomenclatura)} · ${esc(d.nombre)} y todo su historial de versiones.`, ok: 'Eliminar', danger: true })) return;
    await purgeDocFiles(d);
    S.docs = S.docs.filter(x => x.id !== d.id);
    log('documento', `Eliminó ${d.nomenclatura} · ${d.nombre}`); save(); render(); toast('Documento eliminado');
  }

  const nextVersion = (v) => String(parseInt(intVersion(v), 10) + 1);

  /* ---------------- Visor / editor ---------------- */
  function watermarkCss() {
    const txt = `${me.email} · ${new Date().toLocaleDateString('es-MX')}`;
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='340' height='200'><text x='20' y='120' transform='rotate(-24 170 100)' font-family='Helvetica,Arial' font-size='13' fill='rgba(120,120,128,0.38)'>${txt}</text></svg>`;
    return `url('data:image/svg+xml;utf8,${encodeURIComponent(svg).replace(/'/g, '%27')}')`;

      ${[['bold', 'bold', 'Negrita'], ['italic', 'italic', 'Cursiva'], ['underline', 'underline', 'Subrayado'], ['strikeThrough', 'strikethrough', 'Tachado']].map(([c, i, t]) => `<button class="icon-btn" data-cmd="${c}" title="${t}" aria-label="${t}">${ic(i)}</button>`).join('')}
      <span class="sep"></span>
      ${[['insertUnorderedList', 'list', 'Viñetas'], ['insertOrderedList', 'list-ordered', 'Numeración'], ['justifyLeft', 'align-left', 'Izquierda'], ['justifyCenter', 'align-center', 'Centrar'], ['justifyRight', 'align-right', 'Derecha']].map(([c, i, t]) => `<button class="icon-btn" data-cmd="${c}" title="${t}" aria-label="${t}">${ic(i)}</button>`).join('')}
      <span class="sep"></span>
      <button class="icon-btn" data-table title="Insertar tabla" aria-label="Insertar tabla">${ic('table')}</button>
      <button class="icon-btn" data-cmd="removeFormat" title="Quitar formato" aria-label="Quitar formato">${ic('remove-formatting')}</button>
